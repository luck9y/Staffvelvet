<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Velvet Clan</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap");

:root {
  --black: #010101;
  --charcoal: #111214;
  --steel: #777b80;
  --silver: #c9cdd1;
  --white: #f5f5f5;
  --blue: #4aa3ff;
  --blue-bright: #a9d7ff;
  --muted: rgba(220,224,228,.7);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
  color: var(--white);
  font-family: Inter, sans-serif;
  perspective: 1600px;
}

body::before,
body::after {
  position: fixed;
  inset: 0;
  z-index: 900;
  pointer-events: none;
  content: "";
}

body::before {
  background:
    radial-gradient(circle at 50% 45%, transparent 5%, rgba(0,0,0,.22) 48%, rgba(0,0,0,.98) 120%),
    linear-gradient(110deg, rgba(255,255,255,.035), transparent 35%, rgba(255,255,255,.04));
}

body::after {
  opacity: .13;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.12) 4px
  );
  mix-blend-mode: screen;
}

#starField,
#starField::before,
#starField::after {
  position: fixed;
  inset: 0;
  pointer-events: none;
  content: "";
}

#starField {
  z-index: 0;
  opacity: .62;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(150,155,160,.7) 0 1px, transparent 1.5px);
  background-size: 170px 170px, 230px 230px;
  background-position: 20px 40px, 100px 90px;
  animation: starDrift 35s linear infinite;
}

#starField::before {
  background: radial-gradient(ellipse at center, transparent 20%, rgba(30,32,35,.65) 75%);
  animation: breathe 8s ease-in-out infinite;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at center, rgba(210,215,220,.11), transparent 35%),
    #010101;
  transition: opacity 1s ease, visibility 1s ease;
}

#startScreen::before,
#startScreen::after {
  position: absolute;
  border: 1px solid rgba(205,210,215,.32);
  border-radius: 50%;
  content: "";
}

#startScreen::before {
  width: 420px;
  height: 420px;
  box-shadow:
    0 0 30px rgba(190,195,200,.2),
    inset 0 0 40px rgba(190,195,200,.12);
  animation: portal 5s ease-in-out infinite;
}

#startScreen::after {
  width: 300px;
  height: 300px;
  border-color: rgba(255,255,255,.18);
  animation: portalReverse 8s linear infinite;
}

#startScreen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#startBtn {
  position: relative;
  z-index: 1;
  min-width: 220px;
  padding: 19px 42px;
  overflow: hidden;
  border: 1px solid rgba(220,225,230,.8);
  border-radius: 3px;
  background: linear-gradient(135deg, rgba(75,78,82,.8), rgba(10,10,11,.96));
  color: var(--white);
  cursor: pointer;
  font-family: Orbitron, sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 6px;
  text-indent: 6px;
  box-shadow:
    0 0 12px rgba(210,215,220,.45),
    inset 0 0 20px rgba(255,255,255,.12);
  transition: .35s ease;
}

#startBtn::before {
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  content: "";
  transform: skewX(-25deg);
  transition: left .7s ease;
}

#startBtn:hover {
  transform: scale(1.08);
  letter-spacing: 8px;
  box-shadow:
    0 0 20px rgba(220,225,230,.8),
    0 0 70px rgba(170,175,180,.35),
    inset 0 0 25px rgba(255,255,255,.25);
}

#startBtn:hover::before {
  left: 140%;
}

#skipBtn {
  position: fixed;
  top: 24px;
  right: 28px;
  z-index: 1100;
  display: none;
  padding: 9px 15px;
  border: 1px solid rgba(220,225,230,.4);
  border-radius: 2px;
  background: rgba(0,0,0,.42);
  color: var(--muted);
  cursor: pointer;
  font-family: Orbitron, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  backdrop-filter: blur(8px);
  transition: .3s ease;
}

#skipBtn:hover {
  border-color: var(--silver);
  color: #fff;
  box-shadow: 0 0 18px rgba(210,215,220,.55);
}

.label,
#mainTitle,
#flower {
  pointer-events: none;
}

.label {
  position: fixed;
  top: 45%;
  left: 50%;
  z-index: 10;
  width: min(90%, 1100px);
  text-align: center;
  opacity: 0;
  color: var(--white);
  font-family: Cinzel, Georgia, serif;
  font-size: clamp(21px, 3.5vw, 54px);
  font-weight: 700;
  letter-spacing: clamp(1px, .4vw, 6px);
  line-height: 1.3;
  text-shadow:
    0 0 6px #fff,
    0 0 18px var(--silver),
    0 0 45px rgba(180,185,190,.9);
  will-change: transform, opacity, filter;
}

.label::after {
  display: block;
  width: 90px;
  height: 1px;
  margin: 22px auto 0;
  background: linear-gradient(90deg, transparent, var(--silver), transparent);
  box-shadow: 0 0 12px rgba(220,225,230,.8);
  content: "";
}

.accent {
  color: var(--blue-bright);
  text-shadow:
    0 0 5px #fff,
    0 0 14px var(--blue),
    0 0 35px rgba(40,145,255,.95);
}

#mainTitle {
  position: fixed;
  top: 45%;
  left: 50%;
  z-index: 20;
  width: 96%;
  text-align: center;
  opacity: 0;
  color: #fff;
  font-family: Cinzel, Georgia, serif;
  font-size: clamp(32px, 8vw, 112px);
  font-weight: 900;
  letter-spacing: clamp(3px, 1vw, 15px);
  line-height: 1.1;
  text-shadow:
    0 0 5px #fff,
    0 0 15px #fff,
    0 0 35px var(--silver),
    0 0 75px rgba(180,185,190,.9);
  will-change: transform, opacity, filter;
}

#mainTitle::before,
#mainTitle::after {
  position: absolute;
  top: 50%;
  width: 12vw;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--silver));
  box-shadow: 0 0 12px rgba(220,225,230,.8);
  content: "";
}

#mainTitle::before {
  right: 100%;
}

#mainTitle::after {
  left: 100%;
  transform: rotate(180deg);
}

#flower {
  position: fixed;
  top: -220px;
  left: 50%;
  z-index: 5;
  width: 190px;
  opacity: 0;
  filter:
    grayscale(1)
    contrast(1.3)
    drop-shadow(0 0 12px #000)
    drop-shadow(0 0 25px rgba(220,225,230,.5));
}

.hidden {
  display: none !important;
}

.pass-right { animation: passRight 10s ease-in-out forwards; }
.pass-left { animation: passLeft 10s ease-in-out forwards; }
.pass-down { animation: passDown 10s ease-in-out forwards; }
.pass-up { animation: passUp 10s ease-in-out forwards; }
.pass-forward { animation: passForward 10s ease-in-out forwards; }
.pass-diagdr { animation: passDiagDR 10s ease-in-out forwards; }
.pass-diagul { animation: passDiagUL 10s ease-in-out forwards; }
.flower-fall { animation: flowerFall 7s ease-in-out forwards; }
.title-reveal { animation: titleReveal 5s cubic-bezier(.2,.8,.2,1) forwards; }

@keyframes passRight {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translateX(-100px) scale(.75); filter: blur(10px); }
  18% { opacity: 1; transform: translate(-50%,-50%) translateZ(300px) scale(1); filter: blur(2px); }
  52% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translateX(180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translateX(800px) scale(.45); filter: blur(10px); }
}

@keyframes passLeft {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translateX(100px) scale(.75); filter: blur(10px); }
  18% { opacity: 1; transform: translate(-50%,-50%) translateZ(300px) scale(1); filter: blur(2px); }
  52% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translateX(-180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translateX(-800px) scale(.45); filter: blur(10px); }
}

@keyframes passDown {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translateY(-100px) scale(.75); filter: blur(10px); }
  18% { opacity: 1; transform: translate(-50%,-50%) translateZ(300px) scale(1); filter: blur(2px); }
  52% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translateY(180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translateY(800px) scale(.45); filter: blur(10px); }
}

@keyframes passUp {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translateY(100px) scale(.75); filter: blur(10px); }
  18% { opacity: 1; transform: translate(-50%,-50%) translateZ(300px) scale(1); filter: blur(2px); }
  52% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translateY(-180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translateY(-800px) scale(.45); filter: blur(10px); }
}

@keyframes passForward {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(-900px) scale(.4); filter: blur(10px); }
  30% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) scale(1); filter: blur(1px); }
  65% { opacity: 1; transform: translate(-50%,-50%) translateZ(650px) scale(2); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(1500px) scale(4); filter: blur(8px); }
}

@keyframes passDiagDR {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translate(-90px,-90px) scale(.75); filter: blur(10px); }
  20% { opacity: 1; transform: translate(-50%,-50%) translateZ(250px) scale(1); filter: blur(2px); }
  55% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translate(180px,180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translate(800px,800px) scale(.45); filter: blur(10px); }
}

@keyframes passDiagUL {
  0% { opacity: 0; transform: translate(-50%,-50%) translateZ(650px) translate(90px,90px) scale(.75); filter: blur(10px); }
  20% { opacity: 1; transform: translate(-50%,-50%) translateZ(250px) scale(1); filter: blur(2px); }
  55% { opacity: 1; transform: translate(-50%,-50%) translateZ(0) translate(-180px,-180px) scale(1.15); filter: blur(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translateZ(-1000px) translate(-800px,-800px) scale(.45); filter: blur(10px); }
}

@keyframes flowerFall {
  0% { opacity: 0; transform: translateX(-50%) translateY(-240px) rotate(-10deg) scale(.7); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(6deg) scale(1); }
  80% { opacity: .8; transform: translateX(calc(-50% - 20px)) translateY(600px) rotate(10deg) scale(1.1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(900px) rotate(20deg) scale(1.3); }
}

@keyframes titleReveal {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.55); filter: blur(18px); letter-spacing: 25px; }
  45% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); filter: blur(2px); }
  75% { transform: translate(-50%,-50%) scale(1.16); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1.25); filter: blur(0); letter-spacing: clamp(3px,1vw,15px); }
}

@keyframes portal {
  0%,100% { transform: scale(.8) rotate(0); opacity: .35; }
  50% { transform: scale(1.12) rotate(180deg); opacity: .8; }
}

@keyframes portalReverse {
  to { transform: rotate(-360deg); }
}

@keyframes starDrift {
  to { background-position: 20px 500px, 100px -400px; }
}

@keyframes breathe {
  0%,100% { opacity: .35; transform: scale(.9); }
  50% { opacity: 1; transform: scale(1.1); }
}

@media (max-width: 600px) {
  #startScreen::before { width: 280px; height: 280px; }
  #startScreen::after { width: 210px; height: 210px; }
  #mainTitle::before,
  #mainTitle::after { display: none; }
  .label { width: 88%; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<div id="starField"></div>

<div id="startScreen">
  <button id="startBtn">START</button>
</div>

<button id="skipBtn" type="button">SKIP INTRO</button>

<audio id="introAudio" src="sounds/intro2.mp3" preload="auto"></audio>

<img id="flower" src="blackvelvet_flower.png" alt="">

<div id="mainTitle">BLACK VELVET CLAN</div>

<div class="label" id="l1">By the founders of <span class="accent">Azul Clan</span></div>
<div class="label" id="l2">Forged stronger in the abyss</div>
<div class="label" id="l3">Motivated by memories</div>
<div class="label" id="l4">A legacy carved in darkness</div>
<div class="label" id="l5">Directed by those who never stopped dreaming</div>
<div class="label" id="l6">Managed by Gears</div>
<div class="label" id="l7">Back like we never left</div>
<div class="label" id="l8">FOUNDED BY LUCKYY AND SUOAZ</div>

<script>
(() => {
  const startBtn = document.getElementById("startBtn");
  const startScreen = document.getElementById("startScreen");
  const skipBtn = document.getElementById("skipBtn");
  const audio = document.getElementById("introAudio");
  const flower = document.getElementById("flower");
  const mainTitle = document.getElementById("mainTitle");

  const labels = [
    ["l1", "pass-right"],
    ["l2", "pass-left"],
    ["l3", "pass-down"],
    ["l4", "pass-up"],
    ["l5", "pass-forward"],
    ["l6", "pass-diagdr"],
    ["l7", "pass-diagul"],
    ["l8", "pass-right"]
  ];

  let timers = [];

  function schedule(callback, delay) {
    timers.push(setTimeout(callback, delay));
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function resetIntro() {
    clearTimers();

    document.querySelectorAll(".label").forEach(label => {
      label.className = "label";
      label.style.opacity = "0";
    });

    flower.className = "";
    flower.style.opacity = "0";

    mainTitle.className = "";
    mainTitle.style.opacity = "0";
  }

  function showLabel(id, animationClass) {
    const label = document.getElementById(id);
    label.className = "label";
    label.style.opacity = "0";
    void label.offsetWidth;
    label.classList.add(animationClass);
  }

  function startIntro() {
    resetIntro();

    startScreen.classList.add("hidden");
    skipBtn.style.display = "block";

    audio.currentTime = 0;
    audio.volume = 1;

    schedule(() => {
      audio.play().catch(() => {});
    }, 2000);

    labels.forEach(([id, animationClass], index) => {
      schedule(() => showLabel(id, animationClass), 2000 + index * 5000);
    });

    // The flower appears immediately before the clan title.
    schedule(() => {
      flower.className = "";
      void flower.offsetWidth;
      flower.classList.add("flower-fall");
    }, 40500);

    // 41.13 seconds into the audio; audio begins 2 seconds after START.
    schedule(() => {
      mainTitle.className = "";
      void mainTitle.offsetWidth;
      mainTitle.classList.add("title-reveal");
    }, 2000 + 41130);

    // title-reveal lasts 5 seconds, then continue to the home page.
    schedule(() => {
      window.location.href = "home.html";
    }, 2000 + 41130 + 5000);
  }

  function skipIntro() {
    audio.pause();
    audio.currentTime = 0;
    resetIntro();
    startScreen.classList.remove("hidden");
    skipBtn.style.display = "none";
  }

  startBtn.addEventListener("click", startIntro);
  skipBtn.addEventListener("click", skipIntro);
})();
</script>
</body>
</html>
