<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Azul Clan Intro</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: 'Orbitron', sans-serif;
        color: white;
    }

    #startScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 10;
    }

    #startBtn {
        padding: 20px 40px;
        font-size: 24px;
        cursor: pointer;
        background: #222;
        border: 2px solid white;
        color: white;
    }

    #skipBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 20px;
        cursor: pointer;
        color: white;
        display: none;
        z-index: 20;
    }

    .label {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 40%;
        font-size: 40px;
        opacity: 0;
        text-shadow: 0 0 20px #6f00ff;
    }

    #flower {
        position: absolute;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        opacity: 0;
    }

    #mainTitle {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 40%;
        font-size: 70px;
        opacity: 0;
        text-shadow: 0 0 40px #ffffff;
    }

</style>
</head>
<body>

<div id="startScreen">
    <button id="startBtn">START</button>
</div>

<div id="skipBtn">Skip</div>

<audio id="introAudio" src="intro2.mp3"></audio>

<img id="flower" src="blackvelvet_flower.png">

<div id="mainTitle">BLACK VELVET CLAN</div>

<!-- LABELS -->
<div class="label" id="l1">By the founders of Azul Clan</div>
<div class="label" id="l2">Forged stronger in the abyss</div>
<div class="label" id="l3">Motivated by memories</div>
<div class="label" id="l4">A legacy carved in darkness</div>
<div class="label" id="l5">Directed by those who never stopped dreaming</div>
<div class="label" id="l6">Managed by Gears</div>
<div class="label" id="l7">Back like we never left</div>

<script>
const audio = document.getElementById("introAudio");
const skipBtn = document.getElementById("skipBtn");
const startScreen = document.getElementById("startScreen");

const labels = [
    { id: "l1", anim: "right" },
    { id: "l2", anim: "left" },
    { id: "l3", anim: "down" },
    { id: "l4", anim: "up" },
    { id: "l5", anim: "forward" },
    { id: "l6", anim: "diagDR" },
    { id: "l7", anim: "diagUL" }
];

function animateLabel(label, type) {
    let el = document.getElementById(label);
    el.style.transition = "all 5s linear";
    el.style.opacity = 1;

    switch(type) {
        case "right":
            el.style.transform = "translateX(400px) scale(2)";
            break;
        case "left":
            el.style.transform = "translateX(-400px) scale(2)";
            break;
        case "down":
            el.style.transform = "translateY(300px) scale(2)";
            break;
        case "up":
            el.style.transform = "translateY(-300px) scale(2)";
            break;
        case "forward":
            el.style.transform = "scale(6)";
            break;
        case "diagDR":
            el.style.transform = "translate(300px,300px) scale(2)";
            break;
        case "diagUL":
            el.style.transform = "translate(-300px,-300px) scale(2)";
            break;
    }

    setTimeout(() => {
        el.style.opacity = 0;
    }, 4800);
}

document.getElementById("startBtn").onclick = () => {
    startScreen.style.display = "none";
    skipBtn.style.display = "block";

    setTimeout(() => {
        audio.play();
    }, 2000);

    let t = 2000;

    labels.forEach((lbl, i) => {
        setTimeout(() => {
            animateLabel(lbl.id, lbl.anim);
        }, t);
        t += 5000;
    });

    // Flower at 35 seconds
    setTimeout(() => {
        let f = document.getElementById("flower");
        f.style.opacity = 1;
        f.style.transition = "all 7s linear";
        f.style.transform = "translate(-50%, 900px) rotate(25deg)";
    }, 35000);

    // Title at 41.13 seconds
    setTimeout(() => {
        let title = document.getElementById("mainTitle");
        title.style.transition = "all 4s ease";
        title.style.opacity = 1;
        title.style.transform = "scale(1.3)";
    }, 41130);
};

skipBtn.onclick = () => {
    window.location.href = "main.html";
};
</script>

</body>
</html>
