<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Login</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* TITLE SCREEN */
    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #0a0a0a, #000);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #titleScreen h1 {
        font-size: 45px;
        margin-bottom: 30px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #444;
    }

    #playBtn {
        padding: 18px 50px;
        font-size: 24px;
        background: #111;
        border: 3px solid #555;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 0 20px #222;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 10px #333; }
        50% { box-shadow: 0 0 25px #666; }
        100% { box-shadow: 0 0 10px #333; }
    }

    /* GAME WORLD */
    #gameCanvas {
        width: 100vw;
        height: 100vh;
        background: url('flowers/blackvelvet.png');
        background-size: 200px;
        display: none;
        position: relative;
    }

    /* SHADOW CHARACTER */
    #player {
        width: 50px;
        height: 80px;
        background: rgba(20,20,20,0.9);
        border-radius: 10px;
        position: absolute;
        bottom: 50px;
        left: 200px;
        box-shadow: 0 0 20px #333;
        transition: background 0.1s;
    }

    /* WALK ANIMATION */
    .walk {
        animation: walkAnim 0.3s infinite alternate;
    }

    @keyframes walkAnim {
        from { transform: translateY(0); }
        to { transform: translateY(-4px); }
    }

    /* HOUSE */
    #house {
        position: absolute;
        bottom: 50px;
        left: 1500px;
        width: 600px;
        height: 300px;
        background: #111;
        border: 4px solid #333;
        box-shadow: 0 0 30px #000;
    }

    /* DOORS */
    .door {
        width: 80px;
        height: 150px;
        background: #222;
        border: 3px solid #555;
        position: absolute;
        bottom: 0;
    }

    #door1 { left: 50px; }
    #door2 { left: 250px; }
    #door3 { left: 450px; }

    /* ORB */
    #orb {
        width: 40px;
        height: 40px;
        background: #00aaff;
        border-radius: 50%;
        position: absolute;
        bottom: 200px;
        left: 1700px;
        box-shadow: 0 0 25px #00aaff;
        animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }

    /* PROMPT */
    #prompt {
        position: absolute;
        bottom: 150px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 22px;
        opacity: 0;
        transition: opacity 0.2s;
    }
</style>
</head>

<body>

<div id="titleScreen">
    <h1>BLACK VELVET STAFF LOGIN</h1>
    <button id="playBtn">PLAY</button>
</div>

<div id="gameCanvas">
    <div id="player"></div>
    <div id="house">
        <div class="door" id="door1"></div>
        <div class="door" id="door2"></div>
        <div class="door" id="door3"></div>
    </div>
    <div id="orb"></div>
    <div id="prompt">Press F to open door</div>
</div>

<script>
    const playBtn = document.getElementById("playBtn");
    const titleScreen = document.getElementById("titleScreen");
    const gameCanvas = document.getElementById("gameCanvas");
    const player = document.getElementById("player");
    const prompt = document.getElementById("prompt");

    let px = 200;
    let speed = 5;
    let keys = {};

    playBtn.onclick = () => {
        titleScreen.style.display = "none";
        gameCanvas.style.display = "block";
    };

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    function gameLoop() {
        let walking = false;

        if (keys["ArrowRight"] || keys["d"]) {
            px += speed;
            walking = true;
        }
        if (keys["ArrowLeft"] || keys["a"]) {
            px -= speed;
            walking = true;
        }

        player.style.left = px + "px";

        // WALK ANIMATION
        if (walking) player.classList.add("walk");
        else player.classList.remove("walk");

        // DOOR INTERACTION
        let nearDoor = false;

        document.querySelectorAll(".door").forEach(door => {
            let rect = door.getBoundingClientRect();
            let pRect = player.getBoundingClientRect();

            if (pRect.right > rect.left - 20 && pRect.left < rect.right + 20) {
                nearDoor = true;

                if (keys["f"]) {
                    if (door.id === "door1") window.location.href = "stafflogin.html";
                    if (door.id === "door2") window.location.href = "taco.html";
                    if (door.id === "door3") window.location.href = "secret.html";
                }
            }
        });

        prompt.style.opacity = nearDoor ? 1 : 0;

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
