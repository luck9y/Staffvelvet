<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Black Velvet Clan Intro — Final</title>

<!-- Multiple fonts for unique character styles -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&family=Press+Start+2P&family=Major+Mono+Display&display=swap" rel="stylesheet">

<style>
  :root{
    --azul: #4da6ff;
    --abyss: #ff3b3b;
    --bg: #000;
    --audio-target: 0.85;
  }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Petals (black velvet flowers) */
  .petal{
    position:fixed;
    top:-80px;
    width:28px;
    height:28px;
    background: radial-gradient(circle at 30% 30%, #0b0b0b 30%, #000 100%);
    border-radius:50% 50% 40% 60%;
    box-shadow: 0 0 12px rgba(0,0,0,0.6), inset 0 -6px 10px rgba(20,20,20,0.6);
    opacity:0.85;
    transform-origin:center;
    z-index:10;
    pointer-events:none;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity:0.95; }
    100% { transform: translateY(120vh) rotate(720deg); opacity:0.15; }
  }

  /* Big single flower that crosses the screen */
  .big-flower {
    position:fixed;
    top:-120px;
    left:110%;
    width:120px;
    height:120px;
    background: radial-gradient(circle at 30% 30%, #0b0b0b 30%, #000 100%);
    border-radius:50% 50% 40% 60%;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 -12px 20px rgba(30,30,30,0.7);
    z-index:120;
    pointer-events:none;
    opacity:0;
    transform: rotate(-20deg) scale(0.9);
  }

  @keyframes bigFallAcross {
    0% { transform: translateX(0) translateY(0) rotate(-20deg) scale(0.9); opacity:0; left:110%; top:-120px; }
    10% { opacity:1; }
    50% { left:10%; top:40vh; transform: rotate(10deg) scale(1.05); opacity:1; }
    90% { left:-40%; top:110vh; transform: rotate(40deg) scale(1.2); opacity:0.6; }
    100% { left:-60%; top:140vh; opacity:0; transform: rotate(60deg) scale(1.3); }
  }

  /* Start screen */
  #start-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    background:linear-gradient(180deg, rgba(0,0,0,0.96), rgba(0,0,0,0.92));
  }
  #start-btn{
    padding:18px 48px;
    border-radius:10px;
    background:#0f0f0f;
    border:2px solid #222;
    color:#ddd;
    font-size:28px;
    letter-spacing:3px;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #start-btn:hover{ transform:scale(1.04); color:#fff; box-shadow:0 12px 60px rgba(0,0,0,0.7); }

  /* Skip */
  #skip-btn{
    position:fixed;
    top:18px;
    right:18px;
    z-index:1001;
    display:none;
    background:#111;
    color:#cfcfcf;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid #2a2a2a;
    cursor:pointer;
    font-size:14px;
  }
  #skip-btn:hover{ background:#222; color:#fff; }

  /* Vignette */
  .vignette{
    pointer-events:none;
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
    z-index:900;
  }

  /* Intro text base */
  .intro-text{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0.6);
    opacity:0;
    text-align:center;
    letter-spacing:2px;
    z-index:50;
    pointer-events:auto;
    transition: transform .2s ease, text-shadow .2s ease;
    will-change: transform, opacity, text-shadow;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.9); /* outline so text stands out from aura */
    text-stroke: 1.5px rgba(0,0,0,0.9);
  }

  /* Unique font assignments for each label */
  #text1 { font-family: 'Orbitron', sans-serif; font-size:44px; color:#e6e6e6; }
  #textNew { font-family: 'Audiowide', cursive; font-size:42px; color:#f2f2f2; }
  #text2 { font-family: 'Press Start 2P', monospace; font-size:36px; color:#e8e8e8; letter-spacing:1px; }
  #bvc { font-family: 'Major Mono Display', monospace; font-size:78px; letter-spacing:8px; color:#fff; z-index:60; opacity:0; transform:translate(-50%,-50%) scale(0.6); -webkit-text-stroke: 2px rgba(0,0,0,0.95); }

  .intro-text .small{ display:block; margin-top:10px; font-size:18px; color:#cfcfcf; text-shadow:0 0 12px rgba(0,0,0,0.6); }

  .azul{ color:var(--azul); text-shadow: 0 0 28px rgba(77,166,255,0.95), 0 0 6px rgba(77,166,255,0.25); }
  .abyss{ color:var(--abyss); text-shadow: 0 0 32px rgba(255,59,59,0.95), 0 0 8px rgba(102,0,0,0.25); }

  /* varied zoom-through animations (different exits) */
  @keyframes zoomLeft {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-4deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-60%,-50%) scale(1.6) rotate(-2deg); opacity:1; filter:blur(0); }
    100% { transform: translate(-120%,-50%) scale(2.8) rotate(-6deg); opacity:0; filter:blur(8px); }
  }

  @keyframes zoomUp {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(3deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-50%,-80%) scale(1.6) rotate(6deg); opacity:1; filter:blur(0); }
    100% { transform: translate(-50%,-220%) scale(2.6) rotate(12deg); opacity:0; filter:blur(8px); }
  }

  @keyframes zoomRight {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-2deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-40%,-50%) scale(1.6) rotate(2deg); opacity:1; filter:blur(0); }
    100% { transform: translate(160%,-50%) scale(2.8) rotate(8deg); opacity:0; filter:blur(8px); }
  }

  /* slower, longer final zoom-through (10s) */
  @keyframes zoomDepthLong {
    0%   { transform: translate(-50%,-50%) scale(0.45) rotate(-6deg); opacity:0; filter:blur(3px); }
    25%  { transform: translate(-50%,-50%) scale(1.25) rotate(0deg); opacity:1; filter:blur(0); }
    65%  { transform: translate(-45%,-50%) scale(2.4) rotate(10deg); opacity:1; filter:blur(0); }
    100% { transform: translate(260%,-50%) scale(4.0) rotate(22deg); opacity:0; filter:blur(12px); }
  }

  /* Afterimage / water aura pseudo-element base */
  .intro-text::after{
    content: attr(data-text);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) scale(0.6);
    z-index: -1;
    opacity: 0.55;
    filter: blur(10px) saturate(1.2);
    -webkit-text-stroke: 0.8px rgba(0,0,0,0.9);
    pointer-events:none;
    transition: opacity .2s ease;
    white-space: pre;
  }

  /* specific aura colors per element */
  #text1::after { color: rgba(77,166,255,0.55); text-shadow: 0 0 30px rgba(77,166,255,0.9); }
  #textNew::after { color: rgba(120,200,255,0.45); text-shadow: 0 0 28px rgba(120,200,255,0.85); }
  #text2::after { color: rgba(255,80,80,0.45); text-shadow: 0 0 30px rgba(255,80,80,0.9); }
  #bvc::after { color: rgba(200,200,255,0.45); text-shadow: 0 0 60px rgba(200,200,255,0.95); }

  /* aura animations mirror the main animations but with slight delay and blur */
  @keyframes auraLeft {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-4deg); opacity:0.4; filter:blur(12px); }
    20%  { transform: translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:0.65; filter:blur(8px); }
    60%  { transform: translate(-62%,-50%) scale(1.9) rotate(-2deg); opacity:0.5; filter:blur(10px); }
    100% { transform: translate(-140%,-50%) scale(3.2) rotate(-8deg); opacity:0.15; filter:blur(18px); }
  }

  @keyframes auraUp {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(3deg); opacity:0.4; filter:blur(12px); }
    20%  { transform: translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:0.65; filter:blur(8px); }
    60%  { transform: translate(-50%,-86%) scale(1.9) rotate(6deg); opacity:0.5; filter:blur(10px); }
    100% { transform: translate(-50%,-260%) scale(3.0) rotate(14deg); opacity:0.12; filter:blur(18px); }
  }

  @keyframes auraRight {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-2deg); opacity:0.4; filter:blur(12px); }
    20%  { transform: translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:0.65; filter:blur(8px); }
    60%  { transform: translate(-38%,-50%) scale(1.9) rotate(2deg); opacity:0.5; filter:blur(10px); }
    100% { transform: translate(200%,-50%) scale(3.2) rotate(12deg); opacity:0.12; filter:blur(18px); }
  }

  @keyframes auraDepthLong {
    0%   { transform: translate(-50%,-50%) scale(0.45) rotate(-6deg); opacity:0.45; filter:blur(14px); }
    30%  { transform: translate(-50%,-50%) scale(1.35) rotate(0deg); opacity:0.7; filter:blur(8px); }
    60%  { transform: translate(-45%,-50%) scale(2.6) rotate(12deg); opacity:0.5; filter:blur(10px); }
    100% { transform: translate(260%,-50%) scale(4.0) rotate(22deg); opacity:0.08; filter:blur(22px); }
  }

  /* main site placeholder */
  #main-site{ display:none; padding:40px; z-index:1; position:relative; color:#ddd; background:linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.02)); }

</style>
</head>
<body>

<!-- Audio -->
<audio id="intro-audio" src="sounds/intro.mp3" preload="auto"></audio>

<!-- Start screen -->
<div id="start-screen">
  <div id="start-btn" role="button" tabindex="0">START</div>
</div>

<!-- Skip -->
<div id="skip-btn">Skip Intro</div>

<!-- Vignette -->
<div class="vignette"></div>

<!-- Intro texts (data-text used by ::after for aura copy) -->
<div id="text1" class="intro-text" data-text="By the founders of AZUL CLAN">
  By the founders of <span class="azul">AZUL CLAN</span>
</div>

<div id="textNew" class="intro-text" data-text="Back stronger.">
  Back stronger.
</div>

<div id="text2" class="intro-text" data-text="Reborn in the flames of the abyss">
  Reborn in the flames of the abyss
</div>

<div id="bvc" class="intro-text" data-text="BLACK VELVET CLAN">
  BLACK VELVET CLAN
  <span class="small">Founders by Luckyy and Suoaz</span>
</div>

<!-- Main site -->
<div id="main-site">
  <h1>Welcome to Black Velvet Clan</h1>
  <p>Main site content goes here.</p>
</div>

<script>
/* Elements */
const audio = document.getElementById('intro-audio');
const startBtn = document.getElementById('start-btn');
const skipBtn = document.getElementById('skip-btn');
const text1 = document.getElementById('text1');
const textNew = document.getElementById('textNew');
const text2 = document.getElementById('text2');
const bvc = document.getElementById('bvc');
const mainSite = document.getElementById('main-site');

/* spawn petals */
function spawnPetals(count = 30) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + 'vw';
    const s = 12 + Math.random() * 36;
    p.style.width = s + 'px';
    p.style.height = (s * 0.9) + 'px';
    const dur = 4 + Math.random() * 7;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (Math.random() * 2) + 's';
    p.style.opacity = 0.5 + Math.random() * 0.5;
    document.body.appendChild(p);
    p.style.animationName = 'fall';
    p.style.animationTimingFunction = 'linear';
    p.style.animationIterationCount = 'infinite';
  }
}

/* audio fade-in ramp */
function rampAudioTo(target, durationMs = 3000) {
  try {
    audio.volume = 0;
    const stepMs = 50;
    const steps = Math.max(1, Math.floor(durationMs / stepMs));
    let currentStep = 0;
    const interval = setInterval(() => {
      currentStep++;
      const t = currentStep / steps;
      audio.volume = Math.min(target, target * t);
      if (currentStep >= steps) {
        clearInterval(interval);
        audio.volume = target;
      }
    }, stepMs);
  } catch (e) {
    // ignore
  }
}

/* robust audio start delayed by 4s, with fade-in */
function playAudioDelayed(delayMs = 4000) {
  setTimeout(() => {
    audio.volume = 0;
    audio.play().then(() => {
      rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target')) || 0.85, 3500);
    }).catch(() => {
      const resume = () => {
        audio.play().then(() => {
          rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target')) || 0.85, 3500);
        }).catch(()=>{});
        window.removeEventListener('pointerdown', resume);
        window.removeEventListener('touchstart', resume);
      };
      window.addEventListener('pointerdown', resume, { once: true });
      window.addEventListener('touchstart', resume, { once: true });
    });
  }, delayMs);
}

/* mouse proximity glow (keeps outlines intact) */
const introEls = [text1, textNew, text2, bvc];
function updateGlowOnPointer(e) {
  introEls.forEach(el => {
    if (!el || el.style.display === 'none') return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const max = Math.max(window.innerWidth, window.innerHeight);
    const t = Math.max(0, 1 - (dist / (max * 0.6))); // 0..1
    const glow = 12 + Math.round(48 * t);
    const spread = 6 + Math.round(36 * t);
    let color = 'rgba(255,255,255,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'text1') color = 'rgba(77,166,255,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'text2') color = 'rgba(255,59,59,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'textNew') color = 'rgba(120,200,255,' + (0.55 + 0.45*t) + ')';
    if (el.id === 'bvc') color = 'rgba(220,220,255,' + (0.6 + 0.4*t) + ')';
    el.style.textShadow = `0 0 ${glow}px ${color}, 0 0 ${spread}px rgba(0,0,0,0.45)`;
    const scale = 0.98 + 0.12 * t;
    el.style.transform = `translate(-50%,-50%) scale(${scale})`;
  });
}
window.addEventListener('pointermove', updateGlowOnPointer);

/* Sequence scheduling synced to audio start:
   - click Start (t=0)
   - audio starts at t=4000ms
   - text1 at 5000ms (1s after audio)
   - textNew at 10000ms
   - text2 at 15000ms
   - black screen at 20000ms (hide texts)
   - big flower across screen shortly after 20s
   - BVC at 24s after audio start => 4s + 24000ms = 28000ms after click
   - end at 44s after audio start => 48000ms after click
*/
function startSequence() {
  spawnPetals(32);
  playAudioDelayed(4000);

  // text1: zoomLeft (5s)
  setTimeout(() => {
    text1.style.display = 'block';
    text1.style.animation = 'zoomLeft 5s cubic-bezier(.2,.8,.2,1) forwards';
    text1.classList.add('play-aura-left');
  }, 5000);

  // textNew: zoomUp
  setTimeout(() => {
    textNew.style.display = 'block';
    textNew.style.animation = 'zoomUp 5s cubic-bezier(.2,.8,.2,1) forwards';
    textNew.classList.add('play-aura-up');
  }, 10000);

  // text2: zoomRight
  setTimeout(() => {
    text2.style.display = 'block';
    text2.style.animation = 'zoomRight 5s cubic-bezier(.2,.8,.2,1) forwards';
    text2.classList.add('play-aura-right');
  }, 15000);

  // black screen from 20s: hide texts and fade petals
  setTimeout(() => {
    [text1, textNew, text2].forEach(t => { if (t) t.style.display = 'none'; });
    document.querySelectorAll('.petal').forEach(p => { p.style.transition = 'opacity 1s linear'; p.style.opacity = '0'; });
    // spawn the single dramatic flower that crosses the screen right after the last label
    spawnBigFlower();
  }, 20000);

  // BLACK VELVET CLAN appears 24s after audio start => 28s after click
  setTimeout(() => {
    bvc.style.display = 'block';
    // longer, slower cinematic reveal (10s)
    bvc.style.animation = 'zoomDepthLong 10s cubic-bezier(.2,.8,.2,1) forwards';
    bvc.classList.add('play-aura-depth');
    // gently raise audio during final reveal
    rampAudioTo(0.95, 4000);
  }, 28000);

  // End intro at 44s after audio start => 48s after click
  setTimeout(() => endIntro(), 48000);
}

/* spawn a single big flower that crosses the screen */
function spawnBigFlower() {
  const f = document.createElement('div');
  f.className = 'big-flower';
  document.body.appendChild(f);
  // trigger animation
  f.style.animation = 'bigFallAcross 6.5s cubic-bezier(.2,.8,.2,1) forwards';
  // remove after animation
  setTimeout(() => {
    f.style.transition = 'opacity 0.6s linear';
    f.style.opacity = '0';
    setTimeout(() => f.remove(), 800);
  }, 7000);
}

/* End intro cleanup */
function endIntro() {
  document.querySelectorAll('.petal').forEach(p => p.remove());
  [text1, textNew, text2, bvc].forEach(el => { if (el) el.style.display = 'none'; });
  skipBtn.style.display = 'none';
  mainSite.style.display = 'block';
  try { audio.pause(); audio.currentTime = 0; } catch (e) {}
}

/* Start / Skip handlers */
startBtn.addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  skipBtn.style.display = 'block';
  startSequence();
});
skipBtn.addEventListener('click', endIntro);
startBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startBtn.click(); } });

/* Add CSS rules for aura animations on pseudo-elements by injecting a style block that uses classes toggled above */
(function injectAuraStyles(){
  const s = document.createElement('style');
  s.textContent = `
    .play-aura-left::after { animation: auraLeft 5s cubic-bezier(.2,.8,.2,1) forwards; }
    .play-aura-up::after { animation: auraUp 5s cubic-bezier(.2,.8,.2,1) forwards; }
    .play-aura-right::after { animation: auraRight 5s cubic-bezier(.2,.8,.2,1) forwards; }
    .play-aura-depth::after { animation: auraDepthLong 10s cubic-bezier(.2,.8,.2,1) forwards; }
  `;
  document.head.appendChild(s);
})();

/* Accessibility: stop audio on unload */
window.addEventListener('beforeunload', () => { try { audio.pause(); } catch (e) {} });
</script>
</body>
</html>
