<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Black Velvet Clan — Reimagined Intro</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&family=Press+Start+2P&family=Major+Mono+Display&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  :root{
    --azul:#4da6ff;
    --abyss:#ff3b3b;
    --bg:#000;
    --audio-target:0.9;
  }

  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:#fff;font-family:Orbitron, sans-serif;-webkit-font-smoothing:antialiased;}

  /* ---------- Background subtle particles (velvet dust) ---------- */
  .dust {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity:0.06;
    mix-blend-mode:screen;
  }

  /* ---------- Start screen ---------- */
  #start-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;background:linear-gradient(180deg, rgba(0,0,0,0.98), rgba(0,0,0,0.95));}
  #start-btn{padding:18px 48px;border-radius:12px;background:linear-gradient(180deg,#0b0b0b,#151515);border:2px solid #222;color:#ddd;font-size:28px;letter-spacing:3px;cursor:pointer;box-shadow:0 12px 60px rgba(0,0,0,0.7);transition:transform .18s,box-shadow .18s;}
  #start-btn:hover{transform:scale(1.04);box-shadow:0 18px 80px rgba(0,0,0,0.8);color:#fff;}

  /* ---------- Skip ---------- */
  #skip-btn{position:fixed;top:18px;right:18px;z-index:1001;display:none;background:#111;color:#cfcfcf;padding:8px 14px;border-radius:8px;border:1px solid #2a2a2a;cursor:pointer;font-size:14px;}
  #skip-btn:hover{background:#222;color:#fff;}

  /* ---------- Vignette ---------- */
  .vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%);z-index:900;}

  /* ---------- Intro text base + outline ---------- */
  .intro-text{
    position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(0.6);
    opacity:0; text-align:center; letter-spacing:2px; z-index:60;
    pointer-events:auto; will-change:transform,opacity,text-shadow;
    -webkit-text-stroke: 1.6px rgba(0,0,0,0.95);
    text-stroke: 1.6px rgba(0,0,0,0.95);
  }

  /* Unique fonts & sizes */
  #text1{font-family:'Orbitron',sans-serif;font-size:52px;color:#eaeaea;}
  #textNew{font-family:'Audiowide',cursive;font-size:48px;color:#f6f6f6;}
  #text2{font-family:'Press Start 2P',monospace;font-size:36px;color:#e8e8e8;letter-spacing:1px;}
  #bvc{font-family:'Major Mono Display',monospace;font-size:92px;letter-spacing:8px;color:#fff;opacity:0;transform:translate(-50%,-50%) scale(0.6);-webkit-text-stroke:2px rgba(0,0,0,0.98);}

  .small{display:block;margin-top:12px;font-size:18px;color:#dcdcdc;text-shadow:0 0 12px rgba(0,0,0,0.6);}

  .azul{color:var(--azul);text-shadow:0 0 36px rgba(77,166,255,0.95);}
  .abyss{color:var(--abyss);text-shadow:0 0 36px rgba(255,59,59,0.95);}

  /* ---------- Continuous pass animations (7s each) ---------- */
  @keyframes passLeft7 {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(-4deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(-220%,-50%) scale(3.6) rotate(-12deg); opacity:0; filter:blur(12px); }
  }
  @keyframes passUp7 {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(3deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(-50%,-420%) scale(3.4) rotate(20deg); opacity:0; filter:blur(12px); }
  }
  @keyframes passRight7 {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(-2deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.02) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(420%,-50%) scale(3.6) rotate(16deg); opacity:0; filter:blur(12px); }
  }

  /* final title: long, cinematic pass (10s) but appears at audio+25s */
  @keyframes finalPassLong {
    0%   { transform:translate(-50%,-50%) scale(0.45) rotate(-6deg); opacity:0; filter:blur(3px); }
    20%  { transform:translate(-50%,-50%) scale(1.25) rotate(0deg); opacity:1; filter:blur(0); }
    80%  { transform:translate(-45%,-50%) scale(3.0) rotate(10deg); opacity:1; filter:blur(0); }
    100% { transform:translate(420%,-50%) scale(5.0) rotate(22deg); opacity:0; filter:blur(14px); }
  }

  /* ---------- Afterimage / water aura via ::after ---------- */
  .intro-text::after{
    content: attr(data-text);
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(0.6);
    z-index:-1; opacity:0.6; filter: blur(14px) saturate(1.2);
    -webkit-text-stroke:0.8px rgba(0,0,0,0.9); pointer-events:none; white-space:pre;
  }
  #text1::after{ color: rgba(77,166,255,0.55); text-shadow:0 0 40px rgba(77,166,255,0.95); }
  #textNew::after{ color: rgba(120,200,255,0.45); text-shadow:0 0 36px rgba(120,200,255,0.85); }
  #text2::after{ color: rgba(255,80,80,0.45); text-shadow:0 0 36px rgba(255,80,80,0.9); }
  #bvc::after{ color: rgba(220,220,255,0.45); text-shadow:0 0 80px rgba(220,220,255,0.95); }

  /* aura animations (blurred trailing) */
  @keyframes auraLeft7 { 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(-260%,-50%) scale(4.2); opacity:0.12;} }
  @keyframes auraUp7   { 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(-50%,-480%) scale(4.0); opacity:0.12;} }
  @keyframes auraRight7{ 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(480%,-50%) scale(4.2); opacity:0.12;} }
  @keyframes auraFinal10{ 0%{transform:translate(-50%,-50%) scale(0.45);} 20%{transform:translate(-50%,-50%) scale(1.25);} 100%{transform:translate(420%,-50%) scale(5.2); opacity:0.08;} }

  .play-aura-left::after{ animation: auraLeft7 9s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-up::after{ animation: auraUp7 9s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-right::after{ animation: auraRight7 9s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-final::after{ animation: auraFinal10 12s cubic-bezier(.2,.8,.2,1) forwards; }

  /* ---------- Detailed flower (SVG container) ---------- */
  .flower-wrap { position:fixed; inset:0; pointer-events:none; z-index:110; }
  .flower-svg { width:220px; height:220px; position:fixed; left:50%; top:-160px; transform:translateX(-50%) scale(0.9); opacity:0; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); }

  /* trail particles for flower */
  .trail { position:fixed; pointer-events:none; z-index:105; left:0; top:0; }

  /* main site placeholder */
  #main-site{ display:none; padding:40px; z-index:1; position:relative; color:#ddd; background:linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.02)); }
</style>
</head>
<body>

<!-- Audio -->
<audio id="intro-audio" src="sounds/intro.mp3" preload="auto"></audio>

<!-- Start screen -->
<div id="start-screen"><div id="start-btn" role="button" tabindex="0">START</div></div>

<!-- Skip -->
<div id="skip-btn">Skip Intro</div>

<!-- Dust + vignette -->
<div class="dust"></div>
<div class="vignette"></div>

<!-- Intro texts (data-text used by ::after for aura copy) -->
<div id="text1" class="intro-text" data-text="By the founders of AZUL CLAN">By the founders of <span class="azul">AZUL CLAN</span></div>
<div id="textNew" class="intro-text" data-text="Back stronger.">Back stronger.</div>
<div id="text2" class="intro-text" data-text="Reborn in the flames of the abyss">Reborn in the flames of the abyss</div>

<div id="bvc" class="intro-text" data-text="BLACK VELVET CLAN">BLACK VELVET CLAN<span class="small">Founders by Luckyy and Suoaz</span></div>

<!-- Detailed flower SVG container (hidden until triggered) -->
<div class="flower-wrap" id="flower-wrap" aria-hidden="true">
  <svg class="flower-svg" id="flower-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="petalGrad" cx="30%" cy="30%">
        <stop offset="0%" stop-color="#1a1a1a"/>
        <stop offset="45%" stop-color="#0b0b0b"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- center core -->
    <circle cx="100" cy="100" r="18" fill="#0b0b0b" stroke="#222" stroke-width="2" />

    <!-- layered petals (rotated) -->
    <g id="petals" transform="translate(100,100)">
      <!-- 8 petals -->
      <g id="p0" transform="rotate(0)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" filter="url(#softGlow)"/>
      </g>
      <g id="p1" transform="rotate(45)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.98"/>
      </g>
      <g id="p2" transform="rotate(90)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.96"/>
      </g>
      <g id="p3" transform="rotate(135)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.94"/>
      </g>
      <g id="p4" transform="rotate(180)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.92"/>
      </g>
      <g id="p5" transform="rotate(225)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.9"/>
      </g>
      <g id="p6" transform="rotate(270)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.88"/>
      </g>
      <g id="p7" transform="rotate(315)">
        <path d="M0,-18 C28,-40 48,-40 60,-18 C48,-8 28,-8 0,-18 Z" fill="url(#petalGrad)" opacity="0.86"/>
      </g>
    </g>

    <!-- subtle center sheen -->
    <ellipse cx="100" cy="92" rx="10" ry="6" fill="rgba(255,255,255,0.03)"/>
  </svg>
</div>

<!-- trail container -->
<div id="trail" class="trail"></div>

<!-- main site -->
<div id="main-site"><h1>Welcome to Black Velvet Clan</h1><p>Main site content goes here.</p></div>

<script>
/* ---------- Elements ---------- */
const audio = document.getElementById('intro-audio');
const startBtn = document.getElementById('start-btn');
const skipBtn = document.getElementById('skip-btn');
const text1 = document.getElementById('text1');
const textNew = document.getElementById('textNew');
const text2 = document.getElementById('text2');
const bvc = document.getElementById('bvc');
const mainSite = document.getElementById('main-site');
const flowerWrap = document.getElementById('flower-wrap');
const flowerSvg = document.getElementById('flower-svg');
const trail = document.getElementById('trail');

/* ---------- Audio helpers (delayed start + ramp) ---------- */
function rampAudioTo(target, durationMs = 3000) {
  try {
    audio.volume = 0;
    const stepMs = 50;
    const steps = Math.max(1, Math.floor(durationMs / stepMs));
    let currentStep = 0;
    const iv = setInterval(() => {
      currentStep++;
      const t = currentStep / steps;
      audio.volume = Math.min(target, target * t);
      if (currentStep >= steps) { clearInterval(iv); audio.volume = target; }
    }, stepMs);
  } catch (e) {}
}

function playAudioDelayed(delayMs = 4000) {
  setTimeout(() => {
    audio.volume = 0;
    audio.play().then(() => {
      rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target')) || 0.9, 3500);
    }).catch(() => {
      const resume = () => {
        audio.play().then(() => rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target')) || 0.9, 3500)).catch(()=>{});
        window.removeEventListener('pointerdown', resume);
        window.removeEventListener('touchstart', resume);
      };
      window.addEventListener('pointerdown', resume, { once: true });
      window.addEventListener('touchstart', resume, { once: true });
    });
  }, delayMs);
}

/* ---------- Mouse proximity glow (keeps outline) ---------- */
const introEls = [text1, textNew, text2, bvc];
function updateGlow(e) {
  introEls.forEach(el => {
    if (!el || el.style.display === 'none') return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const max = Math.max(window.innerWidth, window.innerHeight);
    const t = Math.max(0, 1 - (dist / (max * 0.6)));
    const glow = 12 + Math.round(48 * t);
    const spread = 6 + Math.round(36 * t);
    let color = 'rgba(255,255,255,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'text1') color = 'rgba(77,166,255,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'text2') color = 'rgba(255,59,59,' + (0.6 + 0.4*t) + ')';
    if (el.id === 'textNew') color = 'rgba(120,200,255,' + (0.55 + 0.45*t) + ')';
    if (el.id === 'bvc') color = 'rgba(220,220,255,' + (0.6 + 0.4*t) + ')';
    el.style.textShadow = `0 0 ${glow}px ${color}, 0 0 ${spread}px rgba(0,0,0,0.45)`;
    const scale = 0.98 + 0.12 * t;
    el.style.transform = `translate(-50%,-50%) scale(${scale})`;
  });
}
window.addEventListener('pointermove', updateGlow);

/* ---------- Petals background spawn ---------- */
function spawnDust(count = 28) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + 'vw';
    const s = 10 + Math.random() * 28;
    p.style.width = s + 'px';
    p.style.height = (s * 0.9) + 'px';
    const dur = 4 + Math.random() * 7;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (Math.random() * 2) + 's';
    p.style.opacity = 0.45 + Math.random() * 0.5;
    document.body.appendChild(p);
    p.style.animationName = 'fall';
    p.style.animationTimingFunction = 'linear';
    p.style.animationIterationCount = 'infinite';
  }
}

/* ---------- Trail particles for flower (small glowing dust) ---------- */
function spawnTrailParticle(x, y, color) {
  const t = document.createElement('div');
  t.style.position = 'fixed';
  t.style.left = x + 'px';
  t.style.top = y + 'px';
  const size = 6 + Math.random() * 10;
  t.style.width = size + 'px';
  t.style.height = size + 'px';
  t.style.borderRadius = '50%';
  t.style.background = color;
  t.style.opacity = 0.9;
  t.style.pointerEvents = 'none';
  t.style.zIndex = 104;
  t.style.filter = 'blur(6px)';
  trail.appendChild(t);
  // animate fade and drift
  const dx = (Math.random() - 0.5) * 120;
  const dy = 80 + Math.random() * 120;
  t.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 0.9 },
    { transform: `translate(${dx}px, ${dy}px) scale(0.6)`, opacity: 0.05 }
  ], { duration: 1600 + Math.random() * 800, easing: 'cubic-bezier(.2,.8,.2,1)' });
  setTimeout(() => t.remove(), 2200 + Math.random() * 800);
}

/* ---------- Detailed flower animation across screen ---------- */
function spawnDetailedFlowerAcross() {
  // show SVG and animate across with easing
  flowerSvg.style.transition = 'none';
  flowerSvg.style.opacity = '0';
  flowerSvg.style.transform = 'translateX(-50%) translateY(-160px) scale(0.9) rotate(-10deg)';
  flowerWrap.style.pointerEvents = 'none';
  // small delay then animate
  requestAnimationFrame(() => {
    flowerSvg.style.transition = 'transform 6.2s cubic-bezier(.2,.8,.2,1), opacity 0.6s linear';
    flowerSvg.style.opacity = '1';
    // animate path: start above center, move diagonally across screen
    const startX = window.innerWidth * 1.1;
    const endX = -window.innerWidth * 0.4;
    const startY = -160;
    const midY = window.innerHeight * 0.45;
    const endY = window.innerHeight * 1.2;
    // use CSS transforms relative to center: we'll animate left/top via style
    flowerSvg.style.left = startX + 'px';
    flowerSvg.style.top = startY + 'px';
    // animate using JS for better control and spawn trail particles
    const duration = 6200;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      // ease
      const ease = (t) => (--t)*t*t+1; // easeOutCubic
      const e = ease(t);
      const x = startX + (endX - startX) * e;
      const y = startY + (endY - startY) * e + Math.sin(e * Math.PI * 2) * 40;
      flowerSvg.style.left = x + 'px';
      flowerSvg.style.top = y + 'px';
      // spawn trail particles along the way
      if (Math.random() < 0.25) {
        spawnTrailParticle(x + 110, y + 110, 'rgba(20,20,30,0.9)');
        spawnTrailParticle(x + 90, y + 120, 'rgba(60,60,80,0.12)');
      }
      if (t < 1) requestAnimationFrame(step);
      else {
        // fade out
        flowerSvg.style.transition = 'opacity .6s linear';
        flowerSvg.style.opacity = '0';
        setTimeout(() => { try { flowerSvg.style.left = '-9999px'; } catch(e){} }, 700);
      }
    }
    requestAnimationFrame(step);
  });
}

/* ---------- Sequence scheduling (synced to audio) ----------
   - Start click t=0
   - audio starts at t=4000ms
   - text1 starts at 5000ms (audio+1s) duration 7s => ends 12000ms
   - textNew starts at 12000ms duration 7s => ends 19000ms
   - text2 starts at 19000ms duration 7s => ends 26000ms
   - after text2 ends (26000ms) spawn detailed flower across (~6.2s)
   - BLACK VELVET CLAN appears at audio+25s => 4000 + 25000 = 29000ms after click
   - final pass lasts 10s; end intro at audio+44s => 48000ms after click
*/
function startSequence() {
  spawnDust(36);
  playAudioDelayed(4000);

  // text1: 7s pass left
  setTimeout(() => {
    text1.style.display = 'block';
    text1.classList.add('play-aura-left');
    text1.style.animation = 'passLeft7 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 5000);

  // textNew: 7s pass up
  setTimeout(() => {
    textNew.style.display = 'block';
    textNew.classList.add('play-aura-up');
    textNew.style.animation = 'passUp7 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 12000);

  // text2: 7s pass right
  setTimeout(() => {
    text2.style.display = 'block';
    text2.classList.add('play-aura-right');
    text2.style.animation = 'passRight7 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 19000);

  // after text2 ends (26s), spawn detailed flower across
  setTimeout(() => {
    // fade small dust
    document.querySelectorAll('.petal').forEach(p => { p.style.transition = 'opacity .8s linear'; p.style.opacity = '0'; });
    spawnDetailedFlowerAcross();
  }, 26000);

  // final title at audio+25s => 29s after click
  setTimeout(() => {
    bvc.style.display = 'block';
    bvc.classList.add('play-aura-final');
    bvc.style.animation = 'finalPassLong 10s cubic-bezier(.2,.8,.2,1) forwards';
    rampAudioTo(0.98, 3500);
  }, 29000);

  // end intro at audio+44s => 48s after click
  setTimeout(() => endIntro(), 48000);
}

/* ---------- End intro cleanup ---------- */
function endIntro() {
  document.querySelectorAll('.petal').forEach(p => p.remove());
  [text1, textNew, text2, bvc].forEach(el => { if (el) el.style.display = 'none'; });
  skipBtn.style.display = 'none';
  mainSite.style.display = 'block';
  try { audio.pause(); audio.currentTime = 0; } catch (e) {}
}

/* ---------- Handlers ---------- */
startBtn.addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  skipBtn.style.display = 'block';
  startSequence();
});
skipBtn.addEventListener('click', endIntro);
startBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startBtn.click(); } });

/* cleanup on unload */
window.addEventListener('beforeunload', () => { try { audio.pause(); } catch (e) {} });
</script>
</body>
</html>
