<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Login</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #1a1a1a; /* greish background */
        font-family: Arial, sans-serif;
        color: white;
    }

    /* TITLE SCREEN */
    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #0a0a0a, #000);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #titleScreen h1 {
        font-size: 45px;
        margin-bottom: 30px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #444;
    }

    #playBtn {
        padding: 18px 50px;
        font-size: 24px;
        background: #111;
        border: 3px solid #555;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 0 20px #222;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 10px #333; }
        50% { box-shadow: 0 0 25px #666; }
        100% { box-shadow: 0 0 10px #333; }
    }

    /* GAME WORLD */
    #gameCanvas {
        width: 3000px; /* long world */
        height: 100vh;
        position: absolute;
        display: none;
        background: linear-gradient(#1a1a1a, #111);
    }

    /* FLOOR */
    #floor {
        position: absolute;
        bottom: 0;
        width: 3000px;
        height: 120px;
        background: #0f0f0f;
        box-shadow: 0 0 20px #444 inset;
    }

    /* GRASS + FLOWERS */
    .flower {
        width: 40px;
        height: 40px;
        background: #000;
        border-radius: 50%;
        position: absolute;
        bottom: 100px;
        box-shadow: 0 0 10px #555;
    }

    /* SHADOW CHARACTER */
    #player {
        width: 60px;
        height: 120px;
        background: #111;
        border-radius: 10px;
        position: absolute;
        bottom: 120px;
        left: 200px;
        box-shadow: 0 0 25px #333;
    }

    /* HEAD */
    #playerHead {
        width: 60px;
        height: 60px;
        background: #0d0d0d;
        border-radius: 50%;
        position: absolute;
        top: -60px;
        left: 0;
        box-shadow: 0 0 20px #222;
    }

    /* WALK ANIMATION */
    .walk {
        animation: walkAnim 0.25s infinite alternate;
    }

    @keyframes walkAnim {
        from { transform: translateY(0); }
        to { transform: translateY(-6px); }
    }

    /* HOUSE */
    #house {
        position: absolute;
        bottom: 120px;
        left: 1600px;
        width: 700px;
        height: 350px;
        background: #141414;
        border: 5px solid #333;
        box-shadow: 0 0 40px #000;
    }

    /* HOUSE ROOF */
    #roof {
        position: absolute;
        top: -80px;
        left: -20px;
        width: 740px;
        height: 80px;
        background: #0d0d0d;
        transform: skewX(-10deg);
        box-shadow: 0 0 20px #222;
    }

    /* DOORS */
    .door {
        width: 100px;
        height: 180px;
        background: #222;
        border: 4px solid #555;
        position: absolute;
        bottom: 0;
        box-shadow: 0 0 20px #000 inset;
    }

    #door1 { left: 80px; }
    #door2 { left: 300px; }
    #door3 { left: 520px; }

    /* STAFF ONLY SIGN */
    #staffOnly {
        position: absolute;
        bottom: 200px;
        left: 520px;
        font-size: 22px;
        color: #ccc;
        text-shadow: 0 0 10px #555;
    }

    /* ORB */
    #orb {
        width: 45px;
        height: 45px;
        background: #00aaff;
        border-radius: 50%;
        position: absolute;
        bottom: 250px;
        left: 1750px;
        box-shadow: 0 0 30px #00aaff;
        animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0); }
    }

    /* PROMPT */
    #prompt {
        position: absolute;
        bottom: 200px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 22px;
        opacity: 0;
        transition: opacity 0.2s;
    }
</style>
</head>

<body>

<div id="titleScreen">
    <h1>BLACK VELVET STAFF LOGIN</h1>
    <button id="playBtn">PLAY</button>
</div>

<div id="gameCanvas">
    <div id="floor"></div>

    <!-- Flowers -->
    <div class="flower" style="left:200px;"></div>
    <div class="flower" style="left:350px;"></div>
    <div class="flower" style="left:500px;"></div>
    <div class="flower" style="left:650px;"></div>
    <div class="flower" style="left:900px;"></div>
    <div class="flower" style="left:1200px;"></div>

    <!-- Player -->
    <div id="player">
        <div id="playerHead"></div>
    </div>

    <!-- House -->
    <div id="house">
        <div id="roof"></div>
        <div class="door" id="door1"></div>
        <div class="door" id="door2"></div>
        <div class="door" id="door3"></div>
        <div id="staffOnly">STAFF ONLY</div>
    </div>

    <!-- Orb -->
    <div id="orb"></div>

    <!-- Prompt -->
    <div id="prompt">Press F to open door</div>
</div>

<script>
    const playBtn = document.getElementById("playBtn");
    const titleScreen = document.getElementById("titleScreen");
    const gameCanvas = document.getElementById("gameCanvas");
    const player = document.getElementById("player");
    const prompt = document.getElementById("prompt");

    let px = 200;
    let speed = 6;
    let keys = {};

    playBtn.onclick = () => {
        titleScreen.style.display = "none";
        gameCanvas.style.display = "block";
    };

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    function gameLoop() {
        let walking = false;

        if (keys["ArrowRight"] || keys["d"]) {
            px += speed;
            walking = true;
        }
        if (keys["ArrowLeft"] || keys["a"]) {
            px -= speed;
            walking = true;
        }

        player.style.left = px + "px";

        // WALK ANIMATION
        if (walking) player.classList.add("walk");
        else player.classList.remove("walk");

        // DOOR INTERACTION
        let nearDoor = false;

        document.querySelectorAll(".door").forEach(door => {
            let rect = door.getBoundingClientRect();
            let pRect = player.getBoundingClientRect();

            if (pRect.right > rect.left - 20 && pRect.left < rect.right + 20) {
                nearDoor = true;

                if (keys["f"]) {
                    if (door.id === "door3") window.location.href = "stafflogin.html";
                    if (door.id === "door1") window.location.href = "taco.html";
                    if (door.id === "door2") window.location.href = "secret.html";
                }
            }
        });

        prompt.style.opacity = nearDoor ? 1 : 0;

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
