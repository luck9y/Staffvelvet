<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Azul Clan Intro</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: 'Orbitron', sans-serif;
        color: white;
        perspective: 1400px; /* depth */
    }

    /* FIXED START SCREEN */
    #startScreen {
        position: fixed;
        inset: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
    }

    #startBtn {
        padding: 22px 45px;
        font-size: 28px;
        cursor: pointer;
        background: #111;
        border: 2px solid white;
        color: white;
        border-radius: 6px;
    }

    #skipBtn {
        position: fixed;
        top: 20px;
        right: 20px;
        font-size: 22px;
        cursor: pointer;
        color: white;
        display: none;
        z-index: 900;
    }

    .label {
        position: fixed;
        width: 100%;
        text-align: center;
        top: 40%;
        font-size: 48px;
        opacity: 0;
        transform-style: preserve-3d;
        text-shadow: 0 0 25px #6f00ff;
        transition: all 5s ease-in-out;
    }

    #flower {
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        opacity: 0;
        filter: drop-shadow(0 0 20px #000);
        transition: all 7s ease-in-out;
    }

    #mainTitle {
        position: fixed;
        width: 100%;
        text-align: center;
        top: 40%;
        font-size: 85px;
        opacity: 0;
        transform-style: preserve-3d;
        text-shadow: 0 0 50px #ffffff;
        transition: all 4s ease;
    }
</style>
</head>
<body>

<div id="startScreen">
    <button id="startBtn">START</button>
</div>

<div id="skipBtn">Skip</div>

<audio id="introAudio" src="intro2.mp3"></audio>

<img id="flower" src="blackvelvet_flower.png">

<div id="mainTitle">BLACK VELVET CLAN</div>

<!-- LABELS -->
<div class="label" id="l1">By the founders of Azul Clan</div>
<div class="label" id="l2">Forged stronger in the abyss</div>
<div class="label" id="l3">Motivated by memories</div>
<div class="label" id="l4">A legacy carved in darkness</div>
<div class="label" id="l5">Directed by those who never stopped dreaming</div>
<div class="label" id="l6">Managed by Gears</div>
<div class="label" id="l7">Back like we never left</div>

<script>
const audio = document.getElementById("introAudio");
const skipBtn = document.getElementById("skipBtn");
const startScreen = document.getElementById("startScreen");

const labels = [
    { id: "l1", anim: "right" },
    { id: "l2", anim: "left" },
    { id: "l3", anim: "down" },
    { id: "l4", anim: "up" },
    { id: "l5", anim: "forward" },
    { id: "l6", anim: "diagDR" },
    { id: "l7", anim: "diagUL" }
];

function animateLabel(label, type) {
    let el = document.getElementById(label);
    el.style.opacity = 1;

    switch(type) {
        case "right":
            el.style.transform = "translateX(650px) rotateY(35deg) translateZ(350px)";
            break;
        case "left":
            el.style.transform = "translateX(-650px) rotateY(-35deg) translateZ(350px)";
            break;
        case "down":
            el.style.transform = "translateY(450px) rotateX(25deg) translateZ(350px)";
            break;
        case "up":
            el.style.transform = "translateY(-450px) rotateX(-25deg) translateZ(350px)";
            break;
        case "forward":
            el.style.transform = "translateZ(1000px) scale(3) rotateY(10deg)";
            break;
        case "diagDR":
            el.style.transform = "translate(450px,450px) rotateY(25deg) rotateX(15deg) translateZ(350px)";
            break;
        case "diagUL":
            el.style.transform = "translate(-450px,-450px) rotateY(-25deg) rotateX(-15deg) translateZ(350px)";
            break;
    }

    setTimeout(() => {
        el.style.opacity = 0;
    }, 4800);
}

document.getElementById("startBtn").onclick = () => {
    startScreen.style.display = "none";
    skipBtn.style.display = "block";

    // GUARANTEED AUDIO PLAYBACK
    audio.volume = 1.0;
    audio.play().catch(() => {
        document.body.addEventListener("click", () => audio.play(), { once: true });
    });

    let t = 2000;

    labels.forEach((lbl) => {
        setTimeout(() => {
            animateLabel(lbl.id, lbl.anim);
        }, t);
        t += 5000;
    });

    // Velvet flower at 35 seconds
    setTimeout(() => {
        let f = document.getElementById("flower");
        f.style.opacity = 1;
        f.style.transform = "translate(-50%, 900px) rotate(40deg)";
    }, 35000);

    // Title at 41.13 seconds
    setTimeout(() => {
        let title = document.getElementById("mainTitle");
        title.style.opacity = 1;
        title.style.transform = "translateZ(500px) scale(1.4) rotateY(10deg)";
    }, 41130);
};

skipBtn.onclick = () => {
    window.location.href = "main.html";
};
</script>

</body>
</html>
