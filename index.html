<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Login</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* TITLE SCREEN */
    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #0a0a0a, #000);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        animation: fadeIn 1s ease;
    }

    #titleScreen h1 {
        font-size: 45px;
        margin-bottom: 30px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #444;
    }

    #playBtn {
        padding: 18px 50px;
        font-size: 24px;
        background: #111;
        border: 3px solid #555;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 0 20px #222;
        animation: pulse 2s infinite;
    }

    #playBtn:hover {
        background: #222;
        border-color: #fff;
        transform: scale(1.08);
        box-shadow: 0 0 25px #666;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 10px #333; }
        50% { box-shadow: 0 0 25px #666; }
        100% { box-shadow: 0 0 10px #333; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    /* GAME AREA */
    #gameCanvas {
        width: 100vw;
        height: 100vh;
        background: url('flowers/blackvelvet.png');
        background-size: 200px;
        display: none;
        position: relative;
        animation: fadeIn 1s ease;
    }

    #player {
        width: 40px;
        height: 40px;
        background: #3a3a3a;
        border-radius: 50%;
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px #555;
    }

    #orb {
        width: 35px;
        height: 35px;
        background: #00aaff;
        border-radius: 50%;
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 20px #00aaff;
    }

    #arrow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 45px;
        opacity: 0.8;
        text-shadow: 0 0 10px #00aaff;
    }
</style>
</head>

<body>

<div id="titleScreen">
    <h1>BLACK VELVET STAFF LOGIN</h1>
    <button id="playBtn">PLAY</button>
</div>

<div id="gameCanvas">
    <div id="player"></div>
    <div id="orb"></div>
    <div id="arrow">⬆</div>
</div>

<script>
    const playBtn = document.getElementById("playBtn");
    const titleScreen = document.getElementById("titleScreen");
    const gameCanvas = document.getElementById("gameCanvas");
    const player = document.getElementById("player");
    const orb = document.getElementById("orb");

    let px = window.innerWidth / 2;
    let py = window.innerHeight * 0.7;

    let keys = {};

    playBtn.onclick = () => {
        titleScreen.style.animation = "fadeOut 0.8s ease";
        setTimeout(() => {
            titleScreen.style.display = "none";
            gameCanvas.style.display = "block";
        }, 800);
    };

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    function gameLoop() {
        let speed = 4;

        if (keys["ArrowUp"] || keys["w"]) py -= speed;
        if (keys["ArrowDown"] || keys["s"]) py += speed;
        if (keys["ArrowLeft"] || keys["a"]) px -= speed;
        if (keys["ArrowRight"] || keys["d"]) px += speed;

        player.style.left = px + "px";
        player.style.top = py + "px";

        // FORWARD → stafflogin.html
        if (py < window.innerHeight * 0.25) {
            window.location.href = "stafflogin.html";
        }

        // BACKWARDS → taco.html
        if (py > window.innerHeight * 0.85) {
            window.location.href = "taco.html";
        }

        // ORB COLLECTION
        let orbRect = orb.getBoundingClientRect();
        let playerRect = player.getBoundingClientRect();

        if (
            playerRect.left < orbRect.right &&
            playerRect.right > orbRect.left &&
            playerRect.top < orbRect.bottom &&
            playerRect.bottom > orbRect.top
        ) {
            orb.style.display = "none";
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
