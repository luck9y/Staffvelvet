<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BL STAFF HQ</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #0d0d0d;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        background: #0d0d0d;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD LENGTHS (Medium Fortress)
const hall1Length = 1200;
const hall2Length = 1500;
const hall3Length = 1000;
const baseLength = 300;

const totalLength = hall1Length + hall2Length + hall3Length + baseLength;

// PLAYER
let player = {
    x: 100,
    y: canvas.height - 200,
    w: 40,
    h: 60,
    velX: 0,
    velY: 0,
    speed: 4,
    jumping: false
};

const gravity = 0.5;
const friction = 0.8;

// CONTROLS
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// CAMERA
let cameraX = 0;

// DOORS
const door1 = {
    x: hall1Length + 200,
    y: canvas.height - 200,
    w: 80,
    h: 140,
    target: "Continued.html"
};

const door2 = {
    x: hall1Length + hall2Length + 200,
    y: canvas.height - 200,
    w: 80,
    h: 140,
    target: "Continue.html"
};

const staffDoor = {
    x: hall1Length + hall2Length + hall3Length + 150,
    y: canvas.height - 200,
    w: 100,
    h: 160,
    target: "stafflogin.html"
};

// GAME LOOP
function update() {
    // Movement SDAW
    if (keys["d"]) player.velX = player.speed;
    else if (keys["a"]) player.velX = -player.speed;
    else player.velX *= friction;

    // Jump
    if (keys["w"] && !player.jumping) {
        player.velY = -12;
        player.jumping = true;
    }

    // Gravity
    player.velY += gravity;

    // Update position
    player.x += player.velX;
    player.y += player.velY;

    // Floor collision
    if (player.y + player.h > canvas.height - 40) {
        player.y = canvas.height - 40 - player.h;
        player.velY = 0;
        player.jumping = false;
    }

    // CAMERA FOLLOW
    cameraX = player.x - canvas.width / 2;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > totalLength - canvas.width) cameraX = totalLength - canvas.width;

    // DOOR INTERACTION
    checkDoor(door1);
    checkDoor(door2);
    checkDoor(staffDoor);

    draw();
    requestAnimationFrame(update);
}

function checkDoor(door) {
    if (
        player.x + player.w > door.x &&
        player.x < door.x + door.w &&
        player.y + player.h > door.y &&
        player.y < door.y + door.h
    ) {
        if (keys["e"]) {
            window.location.href = door.target;
        }
    }
}

function drawHall(xStart, length) {
    ctx.fillStyle = "#111";
    ctx.fillRect(xStart, canvas.height - 40, length, 40);

    // LED floor strips
    ctx.fillStyle = "#ffffff22";
    ctx.fillRect(xStart, canvas.height - 42, length, 4);

    // Clean wall panels
    for (let i = 0; i < length; i += 200) {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(xStart + i, canvas.height - 300, 180, 260);

        ctx.fillStyle = "#ffffff11";
        ctx.fillRect(xStart + i + 10, canvas.height - 290, 160, 4);
    }
}

function drawDoor(door, label) {
    // Sliding sci-fi door
    ctx.fillStyle = "#222";
    ctx.fillRect(door.x, door.y, door.w, door.h);

    ctx.fillStyle = "#ffffff33";
    ctx.fillRect(door.x, door.y, door.w, 6);

    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText(label, door.x - 10, door.y - 10);

    ctx.font = "16px Arial";
    ctx.fillText("Press E", door.x + 5, door.y + door.h + 20);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // HALL 1
    drawHall(0, hall1Length);

    // HALL 2
    drawHall(hall1Length, hall2Length);

    // HALL 3
    drawHall(hall1Length + hall2Length, hall3Length);

    // STAFF BASE
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(hall1Length + hall2Length + hall3Length, canvas.height - 300, baseLength, 260);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("STAFF ONLY", staffDoor.x - 10, staffDoor.y - 20);

    // DOORS
    drawDoor(door1, "Continue..?");
    drawDoor(door2, "Continue..?");
    drawDoor(staffDoor, "STAFF ONLY");

    // PLAYER
    ctx.fillStyle = "#333";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.restore();
}

update();
</script>

</body>
</html>
