<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet Clan — Intro</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Major+Mono+Display&family=Orbitron:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#070407;
    --velvet:#0b0b0f;
    --accent1:#2aa6ff;
    --accent2:#ff6fb3;
    --accent3:#ffd166;
  }

  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#0b0710);font-family:Orbitron,system-ui;}
  .intro-wrap{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, transparent 40%);
    z-index:9999;
  }

  /* Start overlay */
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.65));
    -webkit-backdrop-filter: blur(6px);backdrop-filter: blur(6px);
  }
  .start-btn{
    appearance:none;border:2px solid rgba(255,255,255,0.12);padding:18px 36px;border-radius:10px;color:#fff;background:transparent;font-size:20px;cursor:pointer;
    font-family:Orbitron, sans-serif;letter-spacing:2px;
  }
  .start-btn:focus{outline:3px solid rgba(255,255,255,0.06);}

  .skip-btn{
    position:absolute;top:18px;right:18px;padding:8px 12px;border-radius:6px;background:rgba(0,0,0,0.45);color:#fff;border:1px solid rgba(255,255,255,0.06);cursor:pointer;font-family:Arial, sans-serif;
    display:none;
  }

  /* Background falling petals/velvet dust */
  .particle-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .dust{position:absolute;width:6px;height:6px;border-radius:50%;background:linear-gradient(90deg,#fff2,#fff0);filter:blur(6px);opacity:0.12;animation:fall 12s linear infinite;}
  @keyframes fall{0%{transform:translateY(-10vh) translateX(0) scale(0.6);opacity:0}50%{opacity:0.18}100%{transform:translateY(110vh) translateX(40vw) scale(1);opacity:0}}

  /* Label base */
  .label{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateZ(0);
    color:#fff;font-weight:700;text-align:center;white-space:nowrap;padding:6px 12px;
    -webkit-text-stroke:1px rgba(0,0,0,0.6);
  }
  .label::after{
    content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;color:inherit;
    filter:blur(14px) saturate(120%);opacity:0.85;transform:translate(6px,6px) scale(1.02);
    mix-blend-mode:screen;transition:filter 300ms, transform 300ms;
  }

  /* Per-label fonts & sizes */
  .label.l1{font-family:Orbitron, sans-serif;font-size:48px;letter-spacing:6px;}
  .label.l2{font-family:Audiowide, sans-serif;font-size:40px;letter-spacing:2px;}
  .label.l3{font-family:Press+Start+2P, monospace;font-size:20px;letter-spacing:1px;}
  .label.final{font-family:Major+Mono+Display, monospace;font-size:72px;letter-spacing:8px;}

  /* Glow color variants */
  .l1::after{color:var(--accent1);filter:blur(18px) drop-shadow(0 0 18px rgba(42,166,255,0.6));}
  .l2::after{color:var(--accent2);filter:blur(16px) drop-shadow(0 0 16px rgba(255,111,179,0.55));}
  .l3::after{color:var(--accent3);filter:blur(12px) drop-shadow(0 0 12px rgba(255,209,102,0.45));}
  .final::after{color:#fff;filter:blur(28px) drop-shadow(0 0 28px rgba(0,0,0,0.6));opacity:0.95;}

  /* Motion keyframes (7s passes) */
  @keyframes passLeft7{0%{transform:translate(-50%,-50%) scale(0.9) translateX(0) translateZ(0);opacity:1}100%{transform:translate(-150%,-60%) scale(2.2) translateZ(0);opacity:0}}
  @keyframes passUp7{0%{transform:translate(-50%,-50%) scale(0.95) translateY(0)}100%{transform:translate(-40%,-200%) scale(2.6);opacity:0}}
  @keyframes passRight7{0%{transform:translate(-50%,-50%) scale(0.95) translateX(0)}100%{transform:translate(60%,-40%) scale(3);opacity:0}}
  @keyframes finalPassLong{0%{transform:translate(-50%,-50%) scale(0.9);opacity:0}10%{opacity:1}100%{transform:translate(-50%,-50%) scale(6);opacity:0}}

  /* Apply animations when active */
  .active.l1{animation:passLeft7 7s linear forwards;}
  .active.l2{animation:passUp7 7s cubic-bezier(.22,.9,.3,1) forwards;}
  .active.l3{animation:passRight7 7s cubic-bezier(.2,.8,.25,1) forwards;}
  .active.final{animation:finalPassLong 10s ease-in-out forwards;}

  /* Flower container */
  .flower-wrap{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;overflow:visible;opacity:0;transition:opacity 400ms;}
  .flower-wrap.show{opacity:1;}

  /* Simple particle trail style */
  .trail{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff8,#ff6fb3);filter:blur(6px);opacity:0.9;pointer-events:none;mix-blend-mode:screen;}

  /* Accessibility: hide main content until intro done or skipped */
  #main-content{display:none;}
</style>
</head>
<body>

<div class="intro-wrap" id="intro">
  <div class="overlay" id="overlay" role="dialog" aria-label="Intro start overlay">
    <button class="start-btn" id="startBtn" aria-label="Start intro">START</button>
    <div style="color:#ddd;opacity:0.7;font-size:13px">Press Enter or Space to start</div>
  </div>

  <button class="skip-btn" id="skipBtn" aria-label="Skip intro">Skip Intro</button>

  <div class="particle-bg" id="bgParticles" aria-hidden="true"></div>

  <!-- Labels (hidden until scheduled) -->
  <div class="label l1" id="label1" data-text="AZUL CLAN" aria-hidden="true">AZUL CLAN</div>
  <div class="label l2" id="label2" data-text="Back stronger." aria-hidden="true">Back stronger.</div>
  <div class="label l3" id="label3" data-text="Reborn in the flames of the abyss" aria-hidden="true">Reborn in the flames of the abyss</div>
  <div class="label final" id="finalTitle" data-text="BLACK VELVET CLAN" aria-hidden="true">BLACK VELVET CLAN</div>

  <!-- Flower SVG (inline, animated via JS) -->
  <div class="flower-wrap" id="flowerWrap" aria-hidden="true">
    <svg id="flowerSVG" width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      <defs>
        <radialGradient id="g1" cx="50%" cy="40%">
          <stop offset="0%" stop-color="#fff6" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="#ff6fb3" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#2aa6ff" stop-opacity="0.05"/>
        </radialGradient>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g transform="translate(110,110)" filter="url(#softGlow)">
        <!-- layered petals -->
        <g id="petals">
          <g id="p1" fill="url(#g1)" opacity="0.95">
            <path d="M0 -60 C18 -40 40 -18 60 0 C40 18 18 40 0 60 C-18 40 -40 18 -60 0 C-40 -18 -18 -40 0 -60Z" transform="rotate(0) scale(0.45)"/>
            <path d="M0 -60 C18 -40 40 -18 60 0 C40 18 18 40 0 60 C-18 40 -40 18 -60 0 C-40 -18 -18 -40 0 -60Z" transform="rotate(30) scale(0.42)"/>
            <path d="M0 -60 C18 -40 40 -18 60 0 C40 18 18 40 0 60 C-18 40 -40 18 -60 0 C-40 -18 -18 -40 0 -60Z" transform="rotate(60) scale(0.39)"/>
            <path d="M0 -60 C18 -40 40 -18 60 0 C40 18 18 40 0 60 C-18 40 -40 18 -60 0 C-40 -18 -18 -40 0 -60Z" transform="rotate(90) scale(0.36)"/>
          </g>
        </g>

        <!-- center sheen -->
        <circle cx="0" cy="0" r="18" fill="rgba(255,255,255,0.9)" opacity="0.12"/>
        <circle cx="0" cy="0" r="8" fill="#fff" opacity="0.06"/>
      </g>
    </svg>
  </div>
</div>

<!-- Main site placeholder -->
<main id="main-content" aria-hidden="true">
  <h1 style="color:#fff;text-align:center;padding:40px">Main site content</h1>
</main>

<!-- Audio element (preload metadata) -->
<audio id="introAudio" preload="metadata">
  <source src="sounds/intro.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script>
(function(){
  const START_DELAY = 4000; // ms after Start click until audio begins
  const audio = document.getElementById('introAudio');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('overlay');
  const skipBtn = document.getElementById('skipBtn');
  const intro = document.getElementById('intro');
  const main = document.getElementById('main-content');

  const label1 = document.getElementById('label1');
  const label2 = document.getElementById('label2');
  const label3 = document.getElementById('label3');
  const finalTitle = document.getElementById('finalTitle');
  const flowerWrap = document.getElementById('flowerWrap');
  const bgParticles = document.getElementById('bgParticles');

  let timers = [];
  let startedAt = null;
  let audioStarted = false;

  /* Utility: schedule and track timeouts so Skip can clear them */
  function schedule(fn, ms){
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }
  function clearAllTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }

  /* Audio ramp helper */
  function rampAudioTo(target, duration){
    const start = audio.volume;
    const delta = target - start;
    const steps = Math.max(12, Math.floor(duration/50));
    let i = 0;
    const step = () => {
      i++;
      const t = i/steps;
      audio.volume = Math.min(1, Math.max(0, start + delta * t));
      if(i < steps) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* Robust play with gesture fallback */
  function tryPlayAudio(){
    if(audioStarted) return;
    audioStarted = true;
    audio.volume = 0.0;
    audio.play().then(()=> {
      rampAudioTo(0.7, 3500);
    }).catch(()=> {
      // attach one-time gesture to resume
      const resume = () => {
        audio.play().then(()=> rampAudioTo(0.7, 3500)).catch(()=>{});
        window.removeEventListener('pointerdown', resume);
        window.removeEventListener('touchstart', resume);
      };
      window.addEventListener('pointerdown', resume, {once:true});
      window.addEventListener('touchstart', resume, {once:true});
    });
  }

  /* Create background dust particles */
  function spawnBackgroundDust(count=28){
    const w = window.innerWidth, h = window.innerHeight;
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = Math.random()*100 + 'vw';
      d.style.top = (-10 - Math.random()*10) + 'vh';
      d.style.width = (4 + Math.random()*8) + 'px';
      d.style.height = d.style.width;
      d.style.opacity = (0.05 + Math.random()*0.18);
      d.style.animationDelay = (Math.random()*6) + 's';
      d.style.transform = `translateX(${(Math.random()*40-20)}vw)`;
      bgParticles.appendChild(d);
    }
  }

  /* Flower animation + trail */
  function runFlowerAnimation(){
    flowerWrap.classList.add('show');
    const svg = document.getElementById('flowerSVG');
    const startX = -0.2 * window.innerWidth;
    const endX = 1.2 * window.innerWidth;
    const startY = 0.05 * window.innerHeight;
    const endY = 0.6 * window.innerHeight;
    const duration = 5200; // ms
    const start = performance.now();

    function spawnTrail(x,y){
      const t = document.createElement('div');
      t.className = 'trail';
      t.style.left = x + 'px';
      t.style.top = y + 'px';
      t.style.width = (6 + Math.random()*10) + 'px';
      t.style.height = t.style.width;
      t.style.opacity = 0.9;
      document.body.appendChild(t);
      const life = 800 + Math.random()*600;
      t.animate([
        {transform:`translate(-50%,-50%) scale(1)`, opacity:0.9},
        {transform:`translate(-50%,-50%) scale(0.2)`, opacity:0}
      ], {duration:life, easing:'ease-out'});
      setTimeout(()=> t.remove(), life+50);
    }

    function frame(now){
      const t = Math.min(1, (now - start)/duration);
      // easing
      const ease = (--t)*t*t+1;
      const x = startX + (endX - startX) * ease;
      const y = startY + (endY - startY) * ease;
      svg.style.position = 'fixed';
      svg.style.left = x + 'px';
      svg.style.top = y + 'px';
      svg.style.transform = `translate(-50%,-50%) scale(${0.9 + ease*0.6}) rotate(${ease*20}deg)`;
      // spawn trail occasionally
      if(Math.random() < 0.25) spawnTrail(x + 20 - Math.random()*40, y + 10 - Math.random()*20);
      if(ease < 1) requestAnimationFrame(frame);
      else {
        // fade out
        flowerWrap.classList.remove('show');
      }
    }
    requestAnimationFrame(frame);
  }

  /* Schedule labels relative to audio start */
  function scheduleSequence(){
    // All offsets are relative to audio start (ms)
    // Label 1: audio+1s, duration 7s
    // Label 2: immediately after label1 (audio+8s), duration 7s
    // Label 3: immediately after label2 (audio+15s), duration 7s
    // Flower: immediately after label3 finishes (audio+22s)
    // Final title: audio+25s (long 10s)
    const audioStart = startedAt + START_DELAY;
    const now = Date.now();

    const offset = (t)=> Math.max(0, audioStart + t - now);

    // label1 at audio+1s
    schedule(()=> { label1.classList.add('active','l1'); label1.setAttribute('aria-hidden','false'); }, offset(1000));
    // label2 at audio+8s
    schedule(()=> { label2.classList.add('active','l2'); label2.setAttribute('aria-hidden','false'); }, offset(8000));
    // label3 at audio+15s
    schedule(()=> { label3.classList.add('active','l3'); label3.setAttribute('aria-hidden','false'); }, offset(15000));
    // flower at audio+22s (immediately after label3 finishes)
    schedule(()=> { runFlowerAnimation(); }, offset(22000));
    // final title at audio+25s
    schedule(()=> { finalTitle.classList.add('active','final'); finalTitle.setAttribute('aria-hidden','false'); }, offset(25000));
    // end of intro at audio+44s -> reveal main content
    schedule(()=> { endIntro(); }, offset(44000));
  }

  function endIntro(){
    clearAllTimers();
    // hide intro and show main content
    intro.style.display = 'none';
    main.style.display = '';
    main.setAttribute('aria-hidden','false');
    // stop audio ramp to normal if still playing
    rampAudioTo(0.6, 800);
  }

  /* Skip handler */
  function skipIntro(){
    // stop audio
    try{ audio.pause(); audio.currentTime = 0; }catch(e){}
    endIntro();
  }

  /* Start click handler */
  function onStart(){
    if(startedAt) return;
    startedAt = Date.now();
    overlay.style.display = 'none';
    skipBtn.style.display = 'inline-block';
    // schedule audio start after 4s
    schedule(()=> tryPlayAudio(), START_DELAY);
    // schedule label sequence relative to audio start
    scheduleSequence();
  }

  /* Keyboard accessibility for Start */
  startBtn.addEventListener('click', onStart);
  startBtn.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onStart(); }
  });

  // Also allow Enter/Space when overlay focused
  overlay.addEventListener('keydown', (e)=> {
    if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onStart(); }
  });

  // Skip button
  skipBtn.addEventListener('click', skipIntro);

  // If audio play is blocked, attach fallback pointerdown to resume (one-time)
  audio.addEventListener('play', ()=> { /* no-op; handled in tryPlayAudio */ });

  // Spawn background dust
  spawnBackgroundDust(36);

  // Make sure Start is keyboard-focusable
  startBtn.tabIndex = 0;

  // Expose skip via Escape key
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') skipIntro();
  });

  // Ensure audio volume is set before play attempts
  audio.volume = 0.0;

  // Prevent accidental scrolling on space when overlay is focused
  window.addEventListener('keydown', (e)=> {
    if((e.key === ' ' || e.key === 'Spacebar') && document.activeElement === startBtn) e.preventDefault();
  });

})();
</script>
</body>
</html>
