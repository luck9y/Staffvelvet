<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Velvet Clan</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap");

:root {
  --black:#010101;
  --silver:#c9cdd1;
  --white:#f5f5f5;
  --blue:#4aa3ff;
  --blue-bright:#a9d7ff;
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#010101;
  color:var(--white);
  font-family:Inter,sans-serif;
  perspective:1600px;
}

body::before,
body::after {
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  content:"";
}

body::before {
  background:
    radial-gradient(circle at 50% 45%,transparent 5%,rgba(0,0,0,.25) 48%,rgba(0,0,0,.98) 120%),
    linear-gradient(110deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.04));
}

body::after {
  opacity:.13;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.12) 4px
  );
  mix-blend-mode:screen;
}

#velvetRain {
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.rain-flower {
  position:absolute;
  top:-100px;
  width:var(--size);
  height:var(--size);
  opacity:var(--opacity);
  transform-style:preserve-3d;
  animation:fall var(--duration) linear var(--delay) infinite;
}

.rain-flower .petal {
  position:absolute;
  top:50%;
  left:50%;
  width:42%;
  height:68%;
  border-radius:65% 35% 70% 30%;
  background:
    radial-gradient(ellipse at 28% 14%,rgba(255,255,255,.23),transparent 12%),
    radial-gradient(ellipse at 68% 76%,rgba(0,0,0,.98),transparent 48%),
    linear-gradient(125deg,#3c3c3c 0%,#111 38%,#030303 78%,#000 100%);
  box-shadow:
    inset 3px 3px 7px rgba(255,255,255,.1),
    inset -6px -8px 12px #000,
    0 0 8px rgba(255,255,255,.08);
  transform-origin:0 100%;
}

.rain-flower .petal:nth-child(1){transform:translate(-50%,-100%) rotate(0deg) scale(.9)}
.rain-flower .petal:nth-child(2){transform:translate(-50%,-100%) rotate(60deg) scale(.85)}
.rain-flower .petal:nth-child(3){transform:translate(-50%,-100%) rotate(120deg) scale(.95)}
.rain-flower .petal:nth-child(4){transform:translate(-50%,-100%) rotate(180deg) scale(.88)}
.rain-flower .petal:nth-child(5){transform:translate(-50%,-100%) rotate(240deg) scale(.92)}
.rain-flower .petal:nth-child(6){transform:translate(-50%,-100%) rotate(300deg) scale(.86)}

@keyframes fall {
  0% {
    transform:translate3d(0,-120px,0) rotate(0deg) rotateX(12deg) rotateY(-18deg) scale(.65);
  }
  25% {
    transform:translate3d(var(--sway),25vh,40px) rotate(95deg) rotateX(-18deg) rotateY(20deg) scale(.8);
  }
  50% {
    transform:translate3d(calc(var(--sway) * -1),52vh,-30px) rotate(185deg) rotateX(15deg) rotateY(-15deg) scale(1);
  }
  75% {
    transform:translate3d(var(--sway),78vh,20px) rotate(275deg) rotateX(-12deg) rotateY(18deg) scale(.84);
  }
  100% {
    transform:translate3d(calc(var(--sway) * -1),115vh,-20px) rotate(360deg) rotateX(12deg) rotateY(-18deg) scale(.7);
  }
}

/* One large flower drifting through the background */
#fallingFlower {
  position:fixed;
  top:-28vh;
  left:var(--flower-left);
  z-index:4;
  width:clamp(150px,22vw,330px);
  height:clamp(150px,22vw,330px);
  opacity:.34;
  transform-style:preserve-3d;
  filter:drop-shadow(0 18px 18px rgba(0,0,0,.9));
  animation:largeFlowerFall 27s cubic-bezier(.35,.05,.55,1) infinite;
}

.falling-petal {
  position:absolute;
  top:50%;
  left:50%;
  width:43%;
  height:68%;
  overflow:hidden;
  border-radius:72% 28% 76% 24%;
  transform-origin:0 100%;
  background:
    radial-gradient(ellipse at 27% 12%,rgba(255,255,255,.34),transparent 9%),
    radial-gradient(ellipse at 48% 40%,rgba(90,90,90,.3),transparent 26%),
    radial-gradient(ellipse at 70% 82%,#000 0%,transparent 48%),
    linear-gradient(122deg,#666 0%,#292929 13%,#080808 48%,#000 87%);
  box-shadow:
    inset 7px 5px 15px rgba(255,255,255,.2),
    inset 14px -18px 27px rgba(0,0,0,.98),
    inset -2px 0 4px rgba(255,255,255,.18),
    0 4px 13px rgba(0,0,0,.95);
}

.falling-petal::before {
  position:absolute;
  top:9%;
  left:42%;
  width:3px;
  height:78%;
  border-radius:50%;
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(220,220,220,.34) 28%,
    rgba(20,20,20,.7) 60%,
    transparent
  );
  box-shadow:0 0 6px rgba(255,255,255,.18);
  content:"";
  transform:rotate(-10deg);
}

.falling-petal:nth-child(1){transform:translate(-50%,-100%) rotate(0deg) scale(1)}
.falling-petal:nth-child(2){transform:translate(-50%,-100%) rotate(45deg) scale(.94)}
.falling-petal:nth-child(3){transform:translate(-50%,-100%) rotate(90deg) scale(1.05)}
.falling-petal:nth-child(4){transform:translate(-50%,-100%) rotate(135deg) scale(.96)}
.falling-petal:nth-child(5){transform:translate(-50%,-100%) rotate(180deg) scale(1)}
.falling-petal:nth-child(6){transform:translate(-50%,-100%) rotate(225deg) scale(.94)}
.falling-petal:nth-child(7){transform:translate(-50%,-100%) rotate(270deg) scale(1.05)}
.falling-petal:nth-child(8){transform:translate(-50%,-100%) rotate(315deg) scale(.96)}

.falling-center {
  position:absolute;
  inset:29%;
  z-index:2;
  border-radius:50%;
  background:
    radial-gradient(circle at 31% 25%,#b7b7b7 0 3%,#555 5%,#161616 18%,#030303 58%,#000 78%);
  box-shadow:
    inset 7px 7px 15px rgba(255,255,255,.2),
    inset -13px -14px 20px #000,
    0 0 14px #000;
}

.falling-center::before,
.falling-center::after {
  position:absolute;
  border-radius:50%;
  content:"";
}

.falling-center::before {
  inset:16%;
  border:1px solid rgba(190,190,190,.35);
  box-shadow:inset 0 0 10px #000,0 0 5px rgba(255,255,255,.3);
}

.falling-center::after {
  inset:37%;
  background:radial-gradient(circle at 35% 30%,#999,#111 45%,#000 80%);
  box-shadow:0 0 5px #aaa;
}

@keyframes largeFlowerFall {
  0% {
    transform:translate3d(-12vw,-12vh,0) rotate(-24deg) rotateX(18deg) rotateY(-20deg) scale(.72);
  }
  18% {
    transform:translate3d(7vw,17vh,80px) rotate(34deg) rotateX(-12deg) rotateY(22deg) scale(.86);
  }
  38% {
    transform:translate3d(-8vw,39vh,-30px) rotate(130deg) rotateX(16deg) rotateY(-16deg) scale(1.02);
  }
  59% {
    transform:translate3d(10vw,61vh,55px) rotate(224deg) rotateX(-18deg) rotateY(17deg) scale(.92);
  }
  80% {
    transform:translate3d(-5vw,82vh,-20px) rotate(305deg) rotateX(12deg) rotateY(-20deg) scale(.8);
  }
  100% {
    transform:translate3d(9vw,125vh,20px) rotate(390deg) rotateX(-14deg) rotateY(18deg) scale(.7);
  }
}

#startScreen {
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at center,rgba(210,215,220,.11),transparent 35%),#010101;
  transition:opacity 1s ease,visibility 1s ease;
}

#startScreen::before,
#startScreen::after {
  position:absolute;
  border:1px solid rgba(205,210,215,.32);
  border-radius:50%;
  content:"";
}

#startScreen::before {
  width:420px;
  height:420px;
  box-shadow:0 0 30px rgba(190,195,200,.2),inset 0 0 40px rgba(190,195,200,.12);
  animation:portal 5s ease-in-out infinite;
}

#startScreen::after {
  width:300px;
  height:300px;
  border-color:rgba(255,255,255,.18);
  animation:portalReverse 8s linear infinite;
}

#startScreen.hidden {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#startBtn,
#skipBtn {
  font-family:Orbitron,sans-serif;
  cursor:pointer;
}

#startBtn {
  position:relative;
  z-index:1;
  min-width:220px;
  padding:19px 42px;
  border:1px solid rgba(220,225,230,.8);
  border-radius:3px;
  background:linear-gradient(135deg,rgba(75,78,82,.8),rgba(10,10,11,.96));
  color:var(--white);
  font-size:19px;
  font-weight:700;
  letter-spacing:6px;
  text-indent:6px;
  box-shadow:0 0 12px rgba(210,215,220,.45),inset 0 0 20px rgba(255,255,255,.12);
  transition:.35s ease;
}

#startBtn:hover {
  transform:scale(1.08);
  letter-spacing:8px;
  box-shadow:0 0 20px rgba(220,225,230,.8),0 0 70px rgba(170,175,180,.35),inset 0 0 25px rgba(255,255,255,.25);
}

#skipBtn {
  position:fixed;
  top:24px;
  right:28px;
  z-index:1100;
  display:none;
  padding:9px 15px;
  border:1px solid rgba(220,225,230,.4);
  border-radius:2px;
  background:rgba(0,0,0,.42);
  color:rgba(220,224,228,.7);
  font-size:11px;
  letter-spacing:2px;
  backdrop-filter:blur(8px);
}

.label,
#mainTitle,
#flower {
  pointer-events:none;
}

.label {
  position:fixed;
  top:45%;
  left:50%;
  z-index:100;
  width:min(90%,1100px);
  text-align:center;
  opacity:0;
  color:var(--white);
  font-family:Cinzel,Georgia,serif;
  font-size:clamp(21px,3.5vw,54px);
  font-weight:700;
  letter-spacing:clamp(1px,.4vw,6px);
  line-height:1.3;
  text-shadow:0 0 6px #fff,0 0 18px var(--silver),0 0 45px rgba(180,185,190,.9);
  will-change:transform,opacity,filter;
}

.label::after {
  display:block;
  width:90px;
  height:1px;
  margin:22px auto 0;
  background:linear-gradient(90deg,transparent,var(--silver),transparent);
  content:"";
}

.accent {
  color:var(--blue-bright);
  text-shadow:0 0 5px #fff,0 0 14px var(--blue),0 0 35px rgba(40,145,255,.95);
}

#mainTitle {
  position:fixed;
  top:45%;
  left:50%;
  z-index:120;
  width:96%;
  text-align:center;
  opacity:0;
  color:#fff;
  font-family:Cinzel,Georgia,serif;
  font-size:clamp(32px,8vw,112px);
  font-weight:900;
  letter-spacing:clamp(3px,1vw,15px);
  line-height:1.1;
  text-shadow:0 0 5px #fff,0 0 15px #fff,0 0 35px var(--silver),0 0 75px rgba(180,185,190,.9);
}

#mainTitle::before,
#mainTitle::after {
  position:absolute;
  top:50%;
  width:12vw;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--silver));
  content:"";
}

#mainTitle::before {right:100%}
#mainTitle::after {left:100%;transform:rotate(180deg)}

#flower {
  position:fixed;
  top:44%;
  left:50%;
  z-index:110;
  width:clamp(190px,24vw,330px);
  height:clamp(190px,24vw,330px);
  opacity:0;
  transform:translate(-50%,-50%) scale(.15) rotate(-25deg);
  filter:drop-shadow(0 0 12px #000) drop-shadow(0 0 30px rgba(220,225,230,.35));
}

.flower-core {
  position:absolute;
  inset:28%;
  z-index:3;
  border-radius:50%;
  background:
    radial-gradient(circle at 31% 24%,#b8b8b8 0 3%,#555 5%,#151515 18%,#030303 57%,#000 78%);
  box-shadow:inset 7px 7px 15px rgba(255,255,255,.22),inset -12px -15px 22px #000,0 0 16px #000;
}

.flower-core::after {
  position:absolute;
  inset:27%;
  border:2px solid #555;
  border-radius:50%;
  box-shadow:inset 0 0 8px #000,0 0 5px #aaa;
  content:"";
}

.main-petal {
  position:absolute;
  top:50%;
  left:50%;
  width:42%;
  height:63%;
  border-radius:70% 30% 75% 25%;
  background:
    radial-gradient(ellipse at 28% 13%,rgba(255,255,255,.35),transparent 10%),
    radial-gradient(ellipse at 48% 42%,rgba(100,100,100,.22),transparent 27%),
    radial-gradient(ellipse at 67% 78%,rgba(0,0,0,.99),transparent 48%),
    linear-gradient(125deg,#666 0%,#262626 15%,#080808 53%,#000 88%);
  box-shadow:
    inset 7px 5px 14px rgba(255,255,255,.2),
    inset -13px -17px 25px #000,
    inset 0 0 4px #888,
    0 0 12px rgba(0,0,0,.95);
  transform-origin:0 100%;
}

.main-petal::after {
  position:absolute;
  top:10%;
  left:48%;
  width:2px;
  height:75%;
  border-radius:50%;
  background:linear-gradient(transparent,rgba(210,210,210,.4),transparent);
  box-shadow:0 0 4px rgba(255,255,255,.2);
  content:"";
  transform:rotate(-12deg);
}

.main-petal:nth-child(2){transform:translate(-50%,-100%) rotate(0deg) scale(1)}
.main-petal:nth-child(3){transform:translate(-50%,-100%) rotate(45deg) scale(.94)}
.main-petal:nth-child(4){transform:translate(-50%,-100%) rotate(90deg) scale(1.04)}
.main-petal:nth-child(5){transform:translate(-50%,-100%) rotate(135deg) scale(.92)}
.main-petal:nth-child(6){transform:translate(-50%,-100%) rotate(180deg) scale(1)}
.main-petal:nth-child(7){transform:translate(-50%,-100%) rotate(225deg) scale(.94)}
.main-petal:nth-child(8){transform:translate(-50%,-100%) rotate(270deg) scale(1.04)}
.main-petal:nth-child(9){transform:translate(-50%,-100%) rotate(315deg) scale(.92)}

.flower-bloom {animation:bloomFlower 2.8s cubic-bezier(.2,.8,.2,1) forwards}
.title-reveal {animation:titleReveal 4.5s cubic-bezier(.2,.8,.2,1) forwards}

.pass-right{animation:passRight 5s ease-in-out forwards}
.pass-left{animation:passLeft 5s ease-in-out forwards}
.pass-down{animation:passDown 5s ease-in-out forwards}
.pass-up{animation:passUp 5s ease-in-out forwards}
.pass-forward{animation:passForward 5s ease-in-out forwards}
.pass-diagdr{animation:passDiagDR 5s ease-in-out forwards}
.pass-diagul{animation:passDiagUL 5s ease-in-out forwards}

@keyframes bloomFlower {
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-25deg);filter:blur(15px) brightness(.4)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(8deg);filter:blur(2px) brightness(1)}
  70%{transform:translate(-50%,-50%) scale(.94) rotate(-4deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:blur(0) brightness(1)}
}

@keyframes titleReveal {
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55);filter:blur(18px);letter-spacing:25px}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.05);filter:blur(2px)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1.25);filter:blur(0);letter-spacing:clamp(3px,1vw,15px)}
}

@keyframes passRight {
  0%{opacity:0;transform:translate(-50%,-50%) translateZ(650px) translateX(-100px) scale(.75);filter:blur(10px)}
  18%{opacity:1;transform:translate(-50%,-50%) translateZ(300px) scale(1);filter:blur(2px)}
  52%{opacity:1;transform:translate(-50%,-50%) translateZ(0) translateX(180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translateZ(-1000px) translateX(800px) scale(.45);filter:blur(10px)}
}

@keyframes passLeft {
  0%{opacity:0;transform:translate(-50%,-50%) translateZ(650px) translateX(100px) scale(.75);filter:blur(10px)}
  18%{opacity:1;transform:translate(-50%,-50%) translateZ(300px) scale(1);filter:blur(2px)}
  52%{opacity:1;transform:translate(-50%,-50%) translateZ(0) translateX(-180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translateZ(-1000px) translateX(-800px) scale(.45);filter:blur(10px)}
}

@keyframes passDown {
  0%{opacity:0;transform:translate(-50%,-50%) translateY(-100px) scale(.75);filter:blur(10px)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(2px)}
  55%{opacity:1;transform:translate(-50%,-50%) translateY(180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translateY(800px) scale(.45);filter:blur(10px)}
}

@keyframes passUp {
  0%{opacity:0;transform:translate(-50%,-50%) translateY(100px) scale(.75);filter:blur(10px)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(2px)}
  55%{opacity:1;transform:translate(-50%,-50%) translateY(-180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translateY(-800px) scale(.45);filter:blur(10px)}
}

@keyframes passForward {
  0%{opacity:0;transform:translate(-50%,-50%) translateZ(-900px) scale(.4);filter:blur(10px)}
  30%{opacity:1;transform:translate(-50%,-50%) translateZ(0) scale(1);filter:blur(1px)}
  65%{opacity:1;transform:translate(-50%,-50%) translateZ(650px) scale(2)}
  100%{opacity:0;transform:translate(-50%,-50%) translateZ(1500px) scale(4);filter:blur(8px)}
}

@keyframes passDiagDR {
  0%{opacity:0;transform:translate(-50%,-50%) translate(-90px,-90px) scale(.75);filter:blur(10px)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(2px)}
  55%{opacity:1;transform:translate(-50%,-50%) translate(180px,180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(800px,800px) scale(.45);filter:blur(10px)}
}

@keyframes passDiagUL {
  0%{opacity:0;transform:translate(-50%,-50%) translate(90px,90px) scale(.75);filter:blur(10px)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(2px)}
  55%{opacity:1;transform:translate(-50%,-50%) translate(-180px,-180px) scale(1.15);filter:blur(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(-800px,-800px) scale(.45);filter:blur(10px)}
}

@keyframes portal {
  0%,100%{transform:scale(.8) rotate(0);opacity:.35}
  50%{transform:scale(1.12) rotate(180deg);opacity:.8}
}

@keyframes portalReverse {
  to{transform:rotate(-360deg)}
}

@media (max-width:600px) {
  #startScreen::before{width:280px;height:280px}
  #startScreen::after{width:210px;height:210px}
  #mainTitle::before,#mainTitle::after{display:none}
  .label{width:88%}
}

@media (prefers-reduced-motion:reduce) {
  .label,#mainTitle,#flower,.rain-flower,#fallingFlower {
    animation:none!important;
    filter:none!important;
  }
}
</style>
</head>

<body>
<div id="velvetRain"></div>

<div id="fallingFlower" aria-hidden="true">
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-petal"></span>
  <span class="falling-center"></span>
</div>

<div id="startScreen">
  <button id="startBtn" type="button">START</button>
</div>

<button id="skipBtn" type="button">SKIP INTRO</button>

<audio id="introAudio" src="intro2.mp3" preload="auto"></audio>

<div id="flower" aria-hidden="true">
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="main-petal"></span>
  <span class="flower-core"></span>
</div>

<div id="mainTitle">BLACK VELVET CLAN</div>

<div class="label" id="l1">By the founders of <span class="accent">Azul Clan</span></div>
<div class="label" id="l2">Forged stronger in the abyss</div>
<div class="label" id="l3">Motivated by memories</div>
<div class="label" id="l4">A legacy carved in darkness</div>
<div class="label" id="l5">Directed by those who never stopped dreaming</div>
<div class="label" id="l6">Managed by Gears</div>
<div class="label" id="l7">Back like we never left</div>
<div class="label" id="l8">FOUNDED BY LUCKYY AND SUOAZ</div>

<script>
(() => {
  const startBtn = document.getElementById("startBtn");
  const startScreen = document.getElementById("startScreen");
  const skipBtn = document.getElementById("skipBtn");
  const audio = document.getElementById("introAudio");
  const flower = document.getElementById("flower");
  const mainTitle = document.getElementById("mainTitle");
  const rain = document.getElementById("velvetRain");
  const fallingFlower = document.getElementById("fallingFlower");

  const reducedMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const labels = [
    ["l1","pass-right"],
    ["l2","pass-left"],
    ["l3","pass-down"],
    ["l4","pass-up"],
    ["l5","pass-forward"],
    ["l6","pass-diagdr"],
    ["l7","pass-diagul"],
    ["l8","pass-right"]
  ];

  let timers = [];
  let introStarted = false;

  fallingFlower.style.setProperty("--flower-left", `${12 + Math.random() * 70}%`);

  function createRainFlowers() {
    const amount = window.innerWidth < 600 ? 18 : 34;

    for (let i = 0; i < amount; i++) {
      const rainFlower = document.createElement("div");
      rainFlower.className = "rain-flower";
      rainFlower.style.left = `${Math.random() * 100}%`;
      rainFlower.style.setProperty("--size", `${10 + Math.random() * 28}px`);
      rainFlower.style.setProperty("--opacity", `${.18 + Math.random() * .42}`);
      rainFlower.style.setProperty("--duration", `${18 + Math.random() * 22}s`);
      rainFlower.style.setProperty("--delay", `${Math.random() * -35}s`);
      rainFlower.style.setProperty("--sway", `${-80 + Math.random() * 160}px`);
      rainFlower.style.setProperty("--rotation", `${Math.random() * 360}deg`);

      for (let j = 0; j < 6; j++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        rainFlower.appendChild(petal);
      }

      rain.appendChild(rainFlower);
    }
  }

  function schedule(callback, delay) {
    timers.push(setTimeout(callback, delay));
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function resetIntro() {
    clearTimers();

    document.querySelectorAll(".label").forEach(label => {
      label.className = "label";
      label.style.opacity = "0";
      label.style.transform = "";
    });

    flower.className = "";
    flower.style.opacity = "0";
    flower.style.transform = "";

    mainTitle.className = "";
    mainTitle.style.opacity = "0";
    mainTitle.style.transform = "";
  }

  function showLabel(id, animationClass) {
    const label = document.getElementById(id);
    if (!label) return;

    label.className = "label";
    label.style.opacity = "0";
    label.style.transform = "";

    if (reducedMotion) {
      label.style.opacity = "1";
      label.style.transform = "translate(-50%,-50%)";
      return;
    }

    void label.offsetWidth;
    label.classList.add(animationClass);
  }

  function showTitle() {
    mainTitle.className = "";
    mainTitle.style.opacity = "0";

    if (reducedMotion) {
      mainTitle.style.opacity = "1";
      mainTitle.style.transform = "translate(-50%,-50%)";
      return;
    }

    void mainTitle.offsetWidth;
    mainTitle.classList.add("title-reveal");
  }

  function startAudio() {
    audio.currentTime = 0;
    audio.volume = 1;
    audio.muted = false;

    const request = audio.play();

    if (request && request.catch) {
      request.catch(error => {
        console.warn("Audio playback was blocked:", error);
      });
    }
  }

  function startIntro() {
    if (introStarted) return;

    introStarted = true;
    resetIntro();
    startScreen.classList.add("hidden");
    skipBtn.style.display = "block";
    startAudio();

    labels.forEach(([id, animation], index) => {
      schedule(() => showLabel(id, animation), 2000 + index * 5000);
    });

    schedule(() => {
      if (reducedMotion) {
        flower.style.opacity = "1";
        flower.style.transform = "translate(-50%,-50%)";
      } else {
        flower.classList.add("flower-bloom");
      }
    }, 42200);

    schedule(showTitle, 42830);

    schedule(() => {
      window.location.href = "home.html";
    }, 47830);
  }

  function skipIntro() {
    clearTimers();
    audio.pause();
    audio.currentTime = 0;
    audio.muted = false;
    audio.volume = 1;
    resetIntro();
    startScreen.classList.remove("hidden");
    skipBtn.style.display = "none";
    introStarted = false;
  }

  createRainFlowers();

  startBtn.addEventListener("click", startIntro);
  skipBtn.addEventListener("click", skipIntro);
})();
</script>
</body>
</html>
