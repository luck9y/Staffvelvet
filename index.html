<html lang="en">

    body {
        margin: 0;
        overflow: hidden;
        background: #1c1c1c;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* TITLE SCREEN */
    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #0a0a0a, #000);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #titleScreen h1 {
        font-size: 45px;
        margin-bottom: 30px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #444;
    }

    #playBtn {
        padding: 18px 50px;
        font-size: 24px;
        background: #111;
        border: 3px solid #555;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: 0.25s;
    }

    #playBtn:hover {
        background: #222;
        border-color: #fff;
        transform: scale(1.08);
    }

    /* WORLD */
    #world {
        position: absolute;
        width: 5000px;
        height: 100vh;
        display: none;
        transition: transform 0.05s linear;
    }

        background: #0f0f0f;

    }

        bottom: 140px;
        box-shadow: 0 0 6px #777;
    }
