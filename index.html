<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet Azul Clan Intro</title>
<style>
  :root{
    --bg:#000;
    --glow:#6f00ff;
    --white:#fff;
  }

  /* Basic page */
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    perspective:1400px; /* depth for 3D transforms */
  }

  /* START SCREEN (centered, fixed) */
  #startScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, rgba(0,0,0,0.95), rgba(0,0,0,0.85));
    z-index:1000;
  }

  #startBtn{
    appearance:none;
    -webkit-appearance:none;
    border:2px solid rgba(255,255,255,0.12);
    background:linear-gradient(180deg,#111,#0b0b0b);
    color:var(--white);
    padding:18px 42px;
    font-size:20px;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:6px;
    box-shadow:0 8px 30px rgba(0,0,0,0.6), 0 0 30px rgba(111,0,255,0.06) inset;
    z-index:1001;
  }

  #startBtn:active{ transform:translateY(1px); }

  /* Skip button (top-right) */
  #skipBtn{
    position:fixed;
    top:18px;
    right:18px;
    z-index:1100;
    display:none;
    color:var(--white);
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.06);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    backdrop-filter: blur(4px);
  }

  /* Labels (fixed so they don't affect layout) */
  .label{
    position:fixed;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) translateZ(0);
    width:100%;
    max-width:1600px;
    text-align:center;
    font-weight:600;
    font-size:36px;
    color:var(--white);
    opacity:0;
    letter-spacing:1.6px;
    text-shadow:0 0 18px rgba(111,0,255,0.18), 0 2px 12px rgba(0,0,0,0.6);
    will-change: transform, opacity;
    backface-visibility:hidden;
    pointer-events:none;
  }

  /* Slightly larger on wide screens */
  @media(min-width:1200px){
    .label{ font-size:44px; }
    #mainTitle{ font-size:92px; }
  }

  /* Main title */
  #mainTitle{
    position:fixed;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) translateZ(0) scale(1);
    text-align:center;
    font-size:72px;
    font-weight:800;
    letter-spacing:6px;
    color:var(--white);
    opacity:0;
    text-shadow:0 0 60px rgba(255,255,255,0.12), 0 0 30px rgba(111,0,255,0.12);
    z-index:800;
    will-change: transform, opacity;
    pointer-events:none;
  }

  /* Flower image */
  #flower{
    position:fixed;
    left:50%;
    top:-220px;
    transform:translateX(-50%) rotate(0deg);
    width:220px;
    opacity:0;
    z-index:700;
    will-change: transform, opacity;
    pointer-events:none;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
  }

  /* Individual animation classes (applied by JS) */
  /* Each animation lasts 5s and uses 3D transforms + rotation to feel cinematic */
  .anim-right{
    animation: rightPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-left{
    animation: leftPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-down{
    animation: downPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-up{
    animation: upPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-forward{
    animation: forwardPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-diagdr{
    animation: diagDRPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .anim-diagul{
    animation: diagULPass 5s cubic-bezier(.2,.9,.2,1) forwards;
  }

  /* Flower fall animation (triggered at 35s) */
  .flower-fall{
    animation: flowerFall 7s cubic-bezier(.2,.9,.2,1) forwards;
  }

  /* Title reveal */
  .title-reveal{
    animation: titleReveal 4s cubic-bezier(.2,.9,.2,1) forwards;
  }

  /* Keyframes: cinematic credit-like motion */
  @keyframes rightPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translateX(0) rotateY(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(120px) translateX(0) rotateY(6deg) scale(1.05); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translateX(420px) rotateY(35deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translateX(650px) rotateY(45deg) scale(0.45); }
  }

  @keyframes leftPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translateX(0) rotateY(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(120px) translateX(0) rotateY(-6deg) scale(1.05); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translateX(-420px) rotateY(-35deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translateX(-650px) rotateY(-45deg) scale(0.45); }
  }

  @keyframes downPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translateY(0) rotateX(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(140px) translateY(0) rotateX(6deg) scale(1.03); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translateY(420px) rotateX(30deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translateY(650px) rotateX(45deg) scale(0.45); }
  }

  @keyframes upPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translateY(0) rotateX(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(140px) translateY(0) rotateX(-6deg) scale(1.03); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translateY(-420px) rotateX(-30deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translateY(-650px) rotateX(-45deg) scale(0.45); }
  }

  @keyframes forwardPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(-800px) scale(0.45) rotateY(0); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(-300px) scale(0.8) rotateY(6deg); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(1200px) scale(3.2) rotateY(12deg); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(1600px) scale(4) rotateY(18deg); }
  }

  @keyframes diagDRPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translate(0,0) rotateY(0) rotateX(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(120px) translate(0,0) rotateY(6deg) rotateX(6deg) scale(1.04); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translate(420px,420px) rotateY(30deg) rotateX(18deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translate(650px,650px) rotateY(40deg) rotateX(25deg) scale(0.45); }
  }

  @keyframes diagULPass {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) translate(0,0) rotateY(0) rotateX(0) scale(1); }
    10% { opacity:1; transform:translate(-50%,-50%) translateZ(120px) translate(0,0) rotateY(-6deg) rotateX(-6deg) scale(1.04); }
    60% { opacity:1; transform:translate(-50%,-50%) translateZ(-600px) translate(-420px,-420px) rotateY(-30deg) rotateX(-18deg) scale(0.6); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) translate(-650px,-650px) rotateY(-40deg) rotateX(-25deg) scale(0.45); }
  }

  /* Flower falling like a leaf */
  @keyframes flowerFall {
    0% { opacity:0; transform:translateX(-50%) translateY(-220px) rotate(-10deg) translateZ(0) scale(1); }
    10% { opacity:1; transform:translateX(-50%) translateY(-120px) rotate(-6deg) translateZ(40px) scale(1.02); }
    40% { transform:translateX(calc(-50% + 40px)) translateY(120px) rotate(8deg) translateZ(80px) scale(0.98); }
    60% { transform:translateX(calc(-50% - 30px)) translateY(360px) rotate(-18deg) translateZ(40px) scale(0.95); }
    85% { transform:translateX(calc(-50% + 10px)) translateY(680px) rotate(6deg) translateZ(-40px) scale(0.9); opacity:0.9; }
    100% { opacity:0; transform:translateX(calc(-50% + 0px)) translateY(980px) rotate(20deg) translateZ(-120px) scale(0.85); }
  }

  /* Title reveal */
  @keyframes titleReveal {
    0% { opacity:0; transform:translate(-50%,-50%) translateZ(0) scale(0.9) rotateY(0); filter:blur(6px); }
    20% { opacity:1; transform:translate(-50%,-50%) translateZ(240px) scale(1.05) rotateY(6deg); filter:blur(2px); }
    100% { opacity:1; transform:translate(-50%,-50%) translateZ(520px) scale(1.25) rotateY(10deg); filter:blur(0); }
  }

  /* small helper to hide everything after skip */
  .hidden{ display:none !important; }
</style>
</head>

  </div>

  <button id="skipBtn" aria-label="Skip intro">Skip</button>

  <!-- Audio -->
  <audio id="introAudio" src="intro2.mp3" preload="auto"></audio>

  <!-- Flower (use your high-res PNG with transparent background) -->
  <img id="flower" src="blackvelvet_flower.png" alt="" aria-hidden="true">

  <!-- Main title -->
  <div id="mainTitle" aria-hidden="true">BLACK VELVET CLAN</div>

  <div class="label" id="l1">By the founders of Azul Clan</div>
