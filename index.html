<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Black Velvet Azul Clan Intro</title>
<style>
  :root{
    --bg:#000;
    --white:#fff;
    --accent:#6f00ff;
  }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
    overflow:hidden;
    perspective:1600px;
  }

  /* Start screen */
  #startScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.95);
    z-index:1000;
  }
  #startBtn{
    border:0;
    background:#111;
    color:var(--white);
    padding:18px 44px;
    font-size:20px;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:8px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(111,0,255,0.2) inset;
  }

  #skipBtn{
    position:fixed;
    top:18px;
    right:18px;
    z-index:1100;
    display:none;
    color:var(--white);
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.06);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    backdrop-filter: blur(4px);
  }

  /* Labels */
  .label{
    position:fixed;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) translateZ(0);
    text-align:center;
    font-weight:700;
    font-size:44px;
    color:var(--white);
    opacity:0;
    text-shadow:0 0 18px rgba(111,0,255,0.4), 0 2px 12px rgba(0,0,0,0.6);
    will-change: transform, opacity, filter;
    backface-visibility:hidden;
    pointer-events:none;
  }

  /* Title */
  #mainTitle{
    position:fixed;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) translateZ(0) scale(1);
    text-align:center;
    font-size:92px;
    font-weight:900;
    letter-spacing:6px;
    color:var(--white);
    opacity:0;
    text-shadow:0 0 60px rgba(255,255,255,0.2), 0 0 30px rgba(111,0,255,0.3);
    z-index:800;
    will-change: transform, opacity, filter;
    pointer-events:none;
  }

  /* Flower */
  #flower{
    position:fixed;
    left:50%;
    top:-260px;
    transform:translateX(-50%) rotate(0deg);
    width:220px;
    opacity:0;
    z-index:700;
    will-change: transform, opacity;
    pointer-events:none;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
  }

  /* Animations */
  .pass-right   { animation: passRight 5s ease-in-out forwards; }
  .pass-left    { animation: passLeft 5s ease-in-out forwards; }
  .pass-down    { animation: passDown 5s ease-in-out forwards; }
  .pass-up      { animation: passUp 5s ease-in-out forwards; }
  .pass-forward { animation: passForward 5s ease-in-out forwards; }
  .pass-diagdr  { animation: passDiagDR 5s ease-in-out forwards; }
  .pass-diagul  { animation: passDiagUL 5s ease-in-out forwards; }

  .flower-fall  { animation: flowerFall 7s ease-in-out forwards; }
  .title-reveal { animation: titleReveal 4s ease-out forwards; }

  /* Keyframes */
  @keyframes passRight {
    0%   { opacity:0; transform:translate(-50%,-50%) translateZ(600px) translateX(0) rotateY(0deg) scale(0.8); filter:blur(6px); }
    20%  { opacity:1; transform:translate(-50%,-50%) translateZ(300px) translateX(0) rotateY(5deg) scale(1); filter:blur(2px); }
    50%  { opacity:1; transform:translate(-50%,-50%) translateZ(0px) translateX(200px) rotateY(15deg) scale(1.1); filter:blur(0px); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-800px) translateX(700px) rotateY(40deg) scale(0.5); filter:blur(6px); }
  }
  @keyframes passLeft {
    0%   { opacity:0; transform:translate(-50%,-50%) translateZ(600px) translateX(0) rotateY(0deg) scale(0.8); filter:blur(6px); }
    20%  { opacity:1; transform:translate(-50%,-50%) translateZ(300px) translateX(0) rotateY(-5deg) scale(1); filter:blur(2px); }
    50%  { opacity:1; transform:translate(-50%,-50%) translateZ(0px) translateX(-200px) rotateY(-15deg) scale(1.1); filter:blur(0px); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-800px) translateX(-700px) rotateY(-40deg) scale(0.5); filter:blur(6px); }
  }
  @keyframes passDown {
    0%   { opacity:0; transform:translate(-50%,-50%) translateZ(600px) translateY(0) rotateX(0deg) scale(0.8); filter:blur(6px); }
    20%  { opacity:1; transform:translate(-50%,-50%) translateZ(300px) translateY(0) rotateX(5deg) scale(1); filter:blur(2px); }
    50%  { opacity:1; transform:translate(-50%,-50%) translateZ(0px) translateY(200px) rotateX(15deg) scale(1.1); filter:blur(0px); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-800px) translateY(700px) rotateX(40deg) scale(0.5); filter:blur(6px); }
  }
  @keyframes passUp {
    0%   { opacity:0; transform:translate(-50%,-50%) translateZ(600px) translateY(0) rotateX(0deg) scale(0.8); filter:blur(6px); }
    20%  { opacity:1; transform:translate(-50%,-50%) translateZ(300px) translateY(0) rotateX(-5deg) scale(1); filter:blur(2px); }
    50%  { opacity:1; transform:translate(-50%,-50%) translateZ(0px) translateY(-200px) rotateX(-15deg) scale(1.1); filter:blur(0px); }
    100% { opacity:0; transform:translate(-50%,-50%) translateZ(-800px) translateY(-700px) rotateX(-40deg) scale(0.5); filter:blur(6px); }
  }
  @keyframes passForward {
    0%   { opacity:0; transform:translate(-50%,-50%) translateZ(-900px) scale(0.5) rotateY(0deg); filter:blur(6px); }
    20%  { opacity:1; transform:translate(-50%,-50%) translateZ(-300px) scale(0.9) rotateY(6deg); filter:blur(2px); }
    50%  { opacity:1; transform:translate(-50%,-50%) translateZ(600px) scale(2.2) rotateY(10deg); filter:blur(0px); }
