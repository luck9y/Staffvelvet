<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Clan</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        color: white;
    }

    /* Intro text styling */
    .intro-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        opacity: 0;
        text-align: center;
        letter-spacing: 2px;
        transition: opacity 2s ease;
    }

    /* Small text under BLACK VELVET */
    #bv-small {
        font-size: 16px;
        margin-top: 10px;
        opacity: 0.8;
    }

    /* Skip button */
    #skip-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #1a1a1a;
        color: #ccc;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #333;
        transition: 0.2s;
        z-index: 999;
    }

    #skip-btn:hover {
        background: #2a2a2a;
        color: white;
    }

    /* Main site content (hidden until intro ends) */
    #main-site {
        display: none;
        padding: 40px;
        font-size: 24px;
    }
</style>
</head>

<body>

<!-- Skip Button -->
<div id="skip-btn">Skip Intro</div>

<!-- Intro Text Elements -->
<div id="text1" class="intro-text">By the founders of AZUL CLAN</div>
<div id="text2" class="intro-text">Reborn in the flames of the abyss</div>

<div id="text3" class="intro-text">
    BLACK VELVET
    <div id="bv-small">Founders by Luckyy and Suoaz</div>
</div>

<!-- Main Site Content -->
<div id="main-site">
    <!-- Replace this with your actual homepage content -->
    <h1>Welcome to the Black Velvet Clan</h1>
    <p>Your main site loads here after the intro.</p>
</div>

<script>
/* Fade sequence timing */
function fadeIn(el) {
    el.style.opacity = 1;
}
function fadeOut(el) {
    el.style.opacity = 0;
}

/* Sequence */
setTimeout(() => fadeIn(text1), 500);        // Show first line
setTimeout(() => fadeOut(text1), 3000);      // Hide first line

setTimeout(() => fadeIn(text2), 4500);       // Show second line
setTimeout(() => fadeOut(text2), 7000);      // Hide second line

setTimeout(() => fadeIn(text3), 8500);       // Show BLACK VELVET
setTimeout(() => endIntro(), 12000);         // End intro

/* End intro function */
function endIntro() {
    text1.style.display = "none";
    text2.style.display = "none";
    text3.style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("main-site").style.display = "block";
}

/* Skip button */
document.getElementById("skip-btn").onclick = endIntro;
</script>

</body>
</html>
