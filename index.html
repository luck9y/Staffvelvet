<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Clan Intro</title>

<!-- Cinematic font -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: 'Cinzel', serif;
        color: white;
        transition: background 1s ease;
    }

    /* START SCREEN */
    #start-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
    }

    #start-btn {
        padding: 20px 50px;
        background: #111;
        border: 2px solid #333;
        border-radius: 10px;
        color: #ccc;
        font-size: 28px;
        letter-spacing: 3px;
        cursor: pointer;
        transition: 0.2s;
    }

    #start-btn:hover {
        background: #222;
        color: white;
        border-color: #555;
        transform: scale(1.05);
    }

    /* SKIP BUTTON */
    #skip-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #1a1a1a;
        color: #ccc;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #333;
        transition: 0.2s;
        display: none;
        z-index: 998;
    }

    #skip-btn:hover {
        background: #2a2a2a;
        color: white;
    }

    /* INTRO TEXT BASE STYLE */
    .intro-text {
        position: absolute;
        top: 50%;
        left: 50%;
        opacity: 0;
        text-align: center;
        font-size: 40px;
        letter-spacing: 3px;
        transform: translate(-50%, -50%) scale(0.6);
        text-shadow: 0 0 15px rgba(255,255,255,0.4);
        transition: 0.3s;
    }

    /* Hover glow boost */
    .intro-text:hover {
        text-shadow: 0 0 25px white;
        transform: translate(-50%, -50%) scale(1.05);
    }

    /* Azul Clan Glow */
    .azul {
        color: #4da6ff;
        text-shadow: 0 0 20px #4da6ff;
    }

    /* Abyss Ember Glow */
    .abyss {
        color: #ff3b3b;
        text-shadow: 0 0 25px #660000;
    }

    /* Cinematic zoom animation for all lines */
    @keyframes cinematicZoom {
        0%   { transform: translate(-50%, -50%) scale(0.6) rotate(-3deg); opacity: 0; }
        20%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        60%  { transform: translate(-48%, -50%) scale(1.3) rotate(2deg); opacity: 1; }
        100% { transform: translate(-40%, -50%) scale(1.4) rotate(3deg); opacity: 0; }
    }

    /* Stronger cinematic zoom for BLACK VELVET CLAN */
    @keyframes cinematicZoomStrong {
        0%   { transform: translate(-50%, -50%) scale(0.4) rotate(-5deg); opacity: 0; }
        30%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        70%  { transform: translate(-45%, -50%) scale(1.5) rotate(3deg); opacity: 1; }
        100% { transform: translate(150%, -50%) scale(1.6) rotate(3deg); opacity: 0; }
    }

    #bvc {
        font-size: 70px;
        font-weight: bold;
        letter-spacing: 8px;
        opacity: 0;
    }

    #bv-small {
        font-size: 20px;
        margin-top: 10px;
        color: #cfcfcf;
        text-shadow: 0 0 10px #444;
    }

    /* MAIN SITE */
    #main-site {
        display: none;
        padding: 40px;
        font-size: 24px;
    }
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="intro-audio" src="sounds/intro.mp3"></audio>

<!-- START SCREEN -->
<div id="start-screen">
    <div id="start-btn">START</div>
</div>

<!-- SKIP BUTTON -->
<div id="skip-btn">Skip Intro</div>

<!-- INTRO TEXT SEQUENCE -->
<div id="text1" class="intro-text">
    By the founders of <span class="azul">AZUL CLAN</span>
</div>

<div id="textNew" class="intro-text">
    Reaching for goals beyond reach
</div>

<div id="text2" class="intro-text abyss">
    Reborn in the flames of the abyss
</div>

<div id="bvc" class="intro-text">
    BLACK VELVET CLAN
    <div id="bv-small">Founders by Luckyy and Suoaz</div>
</div>

<!-- MAIN SITE -->
<div id="main-site">
    <h1>Welcome to the Black Velvet Clan</h1>
    <p>Main site content goes here.</p>
</div>

<script>
/* AUDIO PLAY */
function playAudio() {
    const audio = document.getElementById("intro-audio");
    audio.volume = 0.7;

    audio.play().catch(() => {
        document.body.addEventListener("touchstart", () => {
            audio.play();
        }, { once: true });
    });
}

/* START INTRO */
document.getElementById("start-btn").onclick = () => {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("skip-btn").style.display = "block";

    /* Audio starts 4 seconds in */
    setTimeout(() => playAudio(), 4000);

    startSequence();
};

/* INTRO SEQUENCE (44 seconds total) */
function startSequence() {

    /* Azul Clan — starts at 5s */
    setTimeout(() => {
        text1.style.animation = "cinematicZoom 6s ease forwards";
    }, 5000);

    /* New line — starts at 10s */
    setTimeout(() => {
        textNew.style.animation = "cinematicZoom 6s ease forwards";
    }, 10000);

    /* Abyss — starts at 15s */
    setTimeout(() => {
        text2.style.animation = "cinematicZoom 6s ease forwards";
    }, 15000);

    /* Black screen from 21s to 25s */
    setTimeout(() => {
        text1.style.display = "none";
        textNew.style.display = "none";
        text2.style.display = "none";
        document.body.style.background = "black";
    }, 21000);

    /* BLACK VELVET CLAN — appears at 25s */
    setTimeout(() => {
        bvc.style.animation = "cinematicZoomStrong 8s ease forwards";
    }, 25000);

    /* End intro at 44 seconds */
    setTimeout(() => endIntro(), 44000);
}

/* END INTRO */
function endIntro() {
    text1.style.display = "none";
    textNew.style.display = "none";
    text2.style.display = "none";
    bvc.style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("main-site").style.display = "block";
}

/* SKIP BUTTON */
document.getElementById("skip-btn").onclick = endIntro;
</script>

</body>
</html>
