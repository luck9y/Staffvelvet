<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Black Velvet Clan Intro — Varied Exits</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --azul:#4da6ff;
    --abyss:#ff3b3b;
    --bg:#000;
  }

  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Orbitron',sans-serif;color:#fff;}

  /* Petals */
  .petal{position:fixed;top:-60px;width:28px;height:28px;background:radial-gradient(circle at 30% 30%, #0b0b0b 30%, #000 100%);border-radius:50% 50% 40% 60%;box-shadow:0 0 12px rgba(0,0,0,0.6), inset 0 -6px 10px rgba(20,20,20,0.6);opacity:0.85;transform-origin:center;z-index:10;pointer-events:none;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:0.9;}100%{transform:translateY(120vh) rotate(720deg);opacity:0.2;}}

  /* Start */
  #start-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;background:linear-gradient(180deg, rgba(0,0,0,0.95), rgba(0,0,0,0.9));}
  #start-btn{padding:18px 48px;border-radius:10px;background:#0f0f0f;border:2px solid #222;color:#ddd;font-size:28px;letter-spacing:3px;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 6px 30px rgba(0,0,0,0.6);}
  #start-btn:hover{transform:scale(1.04);color:#fff;}

  /* Skip */
  #skip-btn{position:fixed;top:18px;right:18px;z-index:1001;display:none;background:#111;color:#cfcfcf;padding:8px 14px;border-radius:8px;border:1px solid #2a2a2a;cursor:pointer;font-size:14px;}
  #skip-btn:hover{background:#222;color:#fff;}

  /* Intro text base */
  .intro-text{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.6);opacity:0;text-align:center;letter-spacing:2px;z-index:50;pointer-events:auto;transition:transform .2s,text-shadow .2s;will-change:transform,opacity,text-shadow;}
  .intro-text.gamer{font-size:44px;text-shadow:0 0 18px rgba(255,255,255,0.08),0 0 30px rgba(0,0,0,0.6);color:#e6e6e6;}
  .intro-text .small{display:block;margin-top:10px;font-size:18px;color:#cfcfcf;text-shadow:0 0 12px rgba(0,0,0,0.6);}

  .azul{color:var(--azul);text-shadow:0 0 28px rgba(77,166,255,0.9),0 0 6px rgba(77,166,255,0.25);}
  .abyss{color:var(--abyss);text-shadow:0 0 32px rgba(255,59,59,0.9),0 0 8px rgba(102,0,0,0.25);}

  /* varied zoom-through animations */
  @keyframes zoomLeft {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-4deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-60%,-50%) scale(1.6) rotate(-2deg); opacity:1; filter:blur(0); }
    100% { transform: translate(-120%,-50%) scale(2.8) rotate(-6deg); opacity:0; filter:blur(8px); }
  }

  @keyframes zoomUp {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(3deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-50%,-80%) scale(1.6) rotate(6deg); opacity:1; filter:blur(0); }
    100% { transform: translate(-50%,-220%) scale(2.6) rotate(12deg); opacity:0; filter:blur(8px); }
  }

  @keyframes zoomRight {
    0%   { transform: translate(-50%,-50%) scale(0.6) rotate(-2deg); opacity:0; filter:blur(2px); }
    20%  { transform: translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-40%,-50%) scale(1.6) rotate(2deg); opacity:1; filter:blur(0); }
    100% { transform: translate(160%,-50%) scale(2.8) rotate(8deg); opacity:0; filter:blur(8px); }
  }

  /* depth/through camera with slight spin for variety */
  @keyframes zoomDepth {
    0%   { transform: translate(-50%,-50%) scale(0.4) rotate(-6deg); opacity:0; filter:blur(3px); }
    25%  { transform: translate(-50%,-50%) scale(1.2) rotate(0deg); opacity:1; filter:blur(0); }
    60%  { transform: translate(-45%,-50%) scale(2.2) rotate(10deg); opacity:1; filter:blur(0); }
    100% { transform: translate(220%,-50%) scale(3.6) rotate(18deg); opacity:0; filter:blur(10px); }
  }

  /* final title */
  #bvc{font-size:78px;letter-spacing:8px;text-shadow:0 0 60px rgba(255,255,255,0.9),0 0 30px rgba(0,0,0,0.6);color:#fff;z-index:60;opacity:0;transform:translate(-50%,-50%) scale(0.6);}

  /* main site */
  #main-site{display:none;padding:40px;z-index:1;color:#ddd;position:relative;}

  .vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);z-index:900;}
</style>
</head>
<body>

<audio id="intro-audio" src="sounds/intro.mp3" preload="auto"></audio>

<div id="start-screen"><div id="start-btn">START</div></div>
<div id="skip-btn">Skip Intro</div>
<div class="vignette"></div>

<div id="text1" class="intro-text gamer">By the founders of <span class="azul">AZUL CLAN</span></div>
<div id="textNew" class="intro-text gamer">Back stronger.</div>
<div id="text2" class="intro-text gamer abyss">Reborn in the flames of the abyss</div>

<div id="bvc" class="intro-text">BLACK VELVET CLAN
  <span class="small">Founders by Luckyy and Suoaz</span>
</div>

<div id="main-site"><h1>Welcome to Black Velvet Clan</h1><p>Main site content goes here.</p></div>

<script>
/* Elements */
const audio = document.getElementById('intro-audio');
const startBtn = document.getElementById('start-btn');
const skipBtn = document.getElementById('skip-btn');
const text1 = document.getElementById('text1');
const textNew = document.getElementById('textNew');
const text2 = document.getElementById('text2');
const bvc = document.getElementById('bvc');
const mainSite = document.getElementById('main-site');

/* Petals */
function spawnPetals(count=30){
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.left=(Math.random()*100)+'vw';
    const s=12+Math.random()*36;
    p.style.width=s+'px'; p.style.height=(s*0.9)+'px';
    const dur=4+Math.random()*7;
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*2)+'s';
    p.style.opacity=0.5+Math.random()*0.5;
    document.body.appendChild(p);
    p.style.animationName='fall';
    p.style.animationTimingFunction='linear';
    p.style.animationIterationCount='infinite';
  }
}

/* Robust audio start (4s after click) */
function playAudioDelayed(delayMs=4000){
  setTimeout(()=>{
    audio.volume=0.75;
    audio.play().then(()=>{}).catch(()=>{
      const resume=()=>{
        audio.play().catch(()=>{});
        window.removeEventListener('pointerdown',resume);
        window.removeEventListener('touchstart',resume);
      };
      window.addEventListener('pointerdown',resume,{once:true});
      window.addEventListener('touchstart',resume,{once:true});
    });
  },delayMs);
}

/* Mouse proximity glow */
const introEls=[text1,textNew,text2,bvc];
function updateGlow(e){
  introEls.forEach(el=>{
    if(!el || el.style.display==='none') return;
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=e.clientX-cx, dy=e.clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const max=Math.max(window.innerWidth,window.innerHeight);
    const t=Math.max(0,1-(dist/(max*0.6)));
    const glow=10+Math.round(50*t);
    const spread=6+Math.round(40*t);
    let color='rgba(255,255,255,'+(0.6+0.4*t)+')';
    if(el.querySelector('.azul') || el.classList.contains('azul')) color='rgba(77,166,255,'+(0.6+0.4*t)+')';
    if(el.classList.contains('abyss')) color='rgba(255,59,59,'+(0.6+0.4*t)+')';
    el.style.textShadow=`0 0 ${glow}px ${color}, 0 0 ${spread}px rgba(0,0,0,0.45)`;
    const scale=0.98+0.14*t;
    el.style.transform=`translate(-50%,-50%) scale(${scale})`;
  });
}
window.addEventListener('pointermove', updateGlow);

/* Sequence synced to audio start:
   - click Start (t=0)
   - audio starts at t=4000ms
   - text1 at 5000ms (1s after audio)
   - textNew at 10000ms
   - text2 at 15000ms
   - black screen at 20000ms (hide texts)
   - BVC at 29000ms (25s after audio start)
   - end at 48000ms (44s after audio start)
*/
function startSequence(){
  spawnPetals(30);
  playAudioDelayed(4000);

  // text1: zoomLeft (5s)
  setTimeout(()=>{
    text1.style.display='block';
    text1.style.animation='zoomLeft 5s cubic-bezier(.2,.8,.2,1) forwards';
  },5000);

  // textNew: zoomUp
  setTimeout(()=>{
    textNew.style.display='block';
    textNew.style.animation='zoomUp 5s cubic-bezier(.2,.8,.2,1) forwards';
  },10000);

  // text2: zoomRight
  setTimeout(()=>{
    text2.style.display='block';
    text2.style.animation='zoomRight 5s cubic-bezier(.2,.8,.2,1) forwards';
  },15000);

  // black screen: hide texts and fade petals
  setTimeout(()=>{
    [text1,textNew,text2].forEach(t=>{ if(t) t.style.display='none'; });
    document.querySelectorAll('.petal').forEach(p=>{ p.style.transition='opacity 1s linear'; p.style.opacity='0'; });
  },20000);

  // BVC: dramatic depth pass (25s after audio => 29s after click)
  setTimeout(()=>{
    bvc.style.display='block';
    bvc.style.animation='zoomDepth 8s cubic-bezier(.2,.8,.2,1) forwards';
  },29000);

  // End intro at 48s after click (44s after audio)
  setTimeout(()=> endIntro(),48000);
}

function endIntro(){
  document.querySelectorAll('.petal').forEach(p=>p.remove());
  [text1,textNew,text2,bvc].forEach(el=>{ if(el) el.style.display='none'; });
  skipBtn.style.display='none';
  mainSite.style.display='block';
  try{ audio.pause(); audio.currentTime=0; }catch(e){}
}

/* Handlers */
startBtn.addEventListener('click', ()=>{
  document.getElementById('start-screen').style.display='none';
  skipBtn.style.display='block';
  startSequence();
});
skipBtn.addEventListener('click', endIntro);
startBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); startBtn.click(); } });

window.addEventListener('beforeunload', ()=>{ try{ audio.pause(); }catch(e){} });
</script>
</body>
</html>
