<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Staff Login</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
    }

    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(#000, #111);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #titleScreen h1 {
        font-size: 40px;
        margin-bottom: 20px;
        letter-spacing: 3px;
        text-shadow: 0 0 10px #444;
    }

    #playBtn {
        padding: 15px 40px;
        font-size: 20px;
        background: #111;
        border: 2px solid #444;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    #playBtn:hover {
        background: #222;
        border-color: white;
        transform: scale(1.05);
    }

    /* GAME AREA */
    #gameCanvas {
        width: 100vw;
        height: 100vh;
        background: url('flowers/blackvelvet.png');
        background-size: 200px;
        display: none;
        position: relative;
    }

    #player {
        width: 40px;
        height: 40px;
        background: #3a3a3a;
        border-radius: 50%;
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px #555;
    }

    #orb {
        width: 35px;
        height: 35px;
        background: #00aaff;
        border-radius: 50%;
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 20px #00aaff;
    }

    #arrow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 40px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div id="titleScreen">
    <h1>BLACK VELVET STAFF LOGIN
