<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Velvet Clan</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Orbitron:wght@600;700&display=swap");

    :root {
      --white: #f5f5f5;
      --silver: #c9cdd1;
      --blue: #4aa3ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010101;
      color: var(--white);
      font-family: Arial, sans-serif;
      perspective: 1600px;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      content: "";
      background:
        radial-gradient(circle at center, transparent 5%, rgba(0, 0, 0, .35) 55%, #000 120%),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, .08) 4px
        );
    }

    #velvetRain {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .rain-flower {
      position: absolute;
      top: -100px;
      width: var(--size);
      height: var(--size);
      opacity: var(--opacity);
      transform-style: preserve-3d;
      animation: fall var(--duration) linear var(--delay) infinite;
    }

    .petal,
    .falling-petal,
    .main-petal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 0 100%;
      border-radius: 72% 28% 76% 24%;
      background:
        radial-gradient(ellipse at 25% 12%, rgba(255,255,255,.34), transparent 10%),
        radial-gradient(ellipse at 65% 78%, #000 0%, transparent 48%),
        linear-gradient(125deg, #666 0%, #292929 15%, #080808 52%, #000 90%);
      box-shadow:
        inset 6px 5px 14px rgba(255,255,255,.18),
        inset -12px -16px 24px #000,
        0 3px 12px rgba(0,0,0,.95);
    }

    .petal {
      width: 42%;
      height: 68%;
    }

    .petal:nth-child(1) { transform: translate(-50%,-100%) rotate(0deg); }
    .petal:nth-child(2) { transform: translate(-50%,-100%) rotate(60deg) scale(.88); }
    .petal:nth-child(3) { transform: translate(-50%,-100%) rotate(120deg); }
    .petal:nth-child(4) { transform: translate(-50%,-100%) rotate(180deg) scale(.9); }
    .petal:nth-child(5) { transform: translate(-50%,-100%) rotate(240deg); }
    .petal:nth-child(6) { transform: translate(-50%,-100%) rotate(300deg) scale(.88); }

    @keyframes fall {
      0% {
        transform: translate3d(0, -120px, 0) rotate(0deg) rotateX(15deg);
      }
      25% {
        transform: translate3d(var(--sway), 25vh, 40px) rotate(95deg) rotateX(-15deg);
      }
      50% {
        transform: translate3d(calc(var(--sway) * -1), 52vh, -30px) rotate(185deg) rotateY(20deg);
      }
      75% {
        transform: translate3d(var(--sway), 78vh, 20px) rotate(275deg) rotateX(15deg);
      }
      100% {
        transform: translate3d(calc(var(--sway) * -1), 115vh, -20px) rotate(360deg);
      }
    }

    #fallingFlower {
      position: fixed;
      top: -28vh;
      left: var(--flower-left);
      z-index: 4;
      width: clamp(170px, 24vw, 340px);
      height: clamp(170px, 24vw, 340px);
      opacity: .35;
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 18px #000);
      animation: largeFlowerFall 29s cubic-bezier(.35,.05,.55,1) infinite;
    }

    .falling-petal {
      width: 43%;
      height: 68%;
    }

    .falling-petal:nth-child(1) { transform: translate(-50%,-100%) rotate(0deg); }
    .falling-petal:nth-child(2) { transform: translate(-50%,-100%) rotate(45deg) scale(.94); }
    .falling-petal:nth-child(3) { transform: translate(-50%,-100%) rotate(90deg); }
    .falling-petal:nth-child(4) { transform: translate(-50%,-100%) rotate(135deg) scale(.95); }
    .falling-petal:nth-child(5) { transform: translate(-50%,-100%) rotate(180deg); }
    .falling-petal:nth-child(6) { transform: translate(-50%,-100%) rotate(225deg) scale(.94); }
    .falling-petal:nth-child(7) { transform: translate(-50%,-100%) rotate(270deg); }
    .falling-petal:nth-child(8) { transform: translate(-50%,-100%) rotate(315deg) scale(.95); }

    .falling-center,
    .flower-core {
      position: absolute;
      inset: 29%;
      z-index: 2;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #aaa 0 3%, #444 8%, #111 25%, #000 75%);
      box-shadow: inset 8px 8px 15px rgba(255,255,255,.2), inset -14px -15px 20px #000;
    }

    @keyframes largeFlowerFall {
      0% {
        transform: translate3d(-12vw,-12vh,0) rotate(-24deg) rotateX(18deg) rotateY(-20deg) scale(.72);
      }
      25% {
        transform: translate3d(8vw,25vh,80px) rotate(60deg) rotateX(-12deg) rotateY(22deg) scale(.9);
      }
      50% {
        transform: translate3d(-8vw,55vh,-30px) rotate(180deg) rotateX(16deg) rotateY(-16deg) scale(1);
      }
      75% {
        transform: translate3d(10vw,82vh,55px) rotate(290deg) rotateX(-18deg) scale(.88);
      }
      100% {
        transform: translate3d(-5vw,125vh,-20px) rotate(420deg) rotateY(18deg) scale(.7);
      }
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(210,215,220,.12), transparent 35%), #010101;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #startScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startBtn,
    #skipBtn {
      font-family: Orbitron, sans-serif;
      cursor: pointer;
    }

    #startBtn {
      min-width: 220px;
      padding: 19px 42px;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: linear-gradient(135deg, #4b4e52, #0a0a0b);
      color: white;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 6px;
      box-shadow: 0 0 18px rgba(220,225,230,.5);
    }

    #skipBtn {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 1100;
      display: none;
      padding: 9px 15px;
      border: 1px solid rgba(220,225,230,.4);
      background: rgba(0,0,0,.5);
      color: #ddd;
      letter-spacing: 2px;
    }

    .label,
    #mainTitle,
    #flower {
      position: fixed;
      left: 50%;
      pointer-events: none;
      text-align: center;
      opacity: 0;
    }

    .label {
      top: 45%;
      z-index: 100;
      width: min(90%, 1100px);
      transform: translate(-50%, -50%);
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(21px, 3.5vw, 54px);
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 0 6px white, 0 0 18px var(--silver);
    }

    .accent {
      color: #a9d7ff;
    }

    #mainTitle {
      top: 45%;
      z-index: 120;
      width: 96%;
      transform: translate(-50%, -50%);
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(32px, 8vw, 112px);
      font-weight: 900;
      letter-spacing: clamp(3px, 1vw, 15px);
      text-shadow: 0 0 5px white, 0 0 35px var(--silver);
    }

    #flower {
      top: 44%;
      z-index: 110;
      width: clamp(190px, 24vw, 330px);
      height: clamp(190px, 24vw, 330px);
      transform: translate(-50%, -50%) scale(.15) rotate(-25deg);
      filter: drop-shadow(0 0 25px rgba(220,225,230,.35));
    }

    .main-petal {
      width: 42%;
      height: 63%;
    }

    .main-petal:nth-child(2) { transform: translate(-50%,-100%) rotate(0deg); }
    .main-petal:nth-child(3) { transform: translate(-50%,-100%) rotate(45deg) scale(.94); }
    .main-petal:nth-child(4) { transform: translate(-50%,-100%) rotate(90deg) scale(1.04); }
    .main-petal:nth-child(5) { transform: translate(-50%,-100%) rotate(135deg) scale(.92); }
    .main-petal:nth-child(6) { transform: translate(-50%,-100%) rotate(180deg); }
    .main-petal:nth-child(7) { transform: translate(-50%,-100%) rotate(225deg) scale(.94); }
    .main-petal:nth-child(8) { transform: translate(-50%,-100%) rotate(270deg) scale(1.04); }
    .main-petal:nth-child(9) { transform: translate(-50%,-100%) rotate(315deg) scale(.92); }

    .flower-bloom {
      animation: bloomFlower 2.8s ease forwards;
    }

    .title-reveal {
      animation: titleReveal 4.5s ease forwards;
    }

    @keyframes bloomFlower {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.15) rotate(-25deg); filter: blur(15px); }
      45% { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(8deg); filter: blur(2px); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); filter: blur(0); }
    }

    @keyframes titleReveal {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.55); filter: blur(18px); }
      45% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); filter: blur(2px); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1.25); filter: blur(0); }
    }

    @keyframes sentenceInOut {
      0%, 10% { opacity: 0; transform: translate(-50%,-50%) scale(.9); filter: blur(10px); }
      25%, 70% { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.08); filter: blur(12px); }
    }

    .label.playing {
      animation: sentenceInOut 5s ease forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .rain-flower,
      #fallingFlower {
        animation: none;
      }

      .label,
      #mainTitle,
      #flower {
        animation: none !important;
        filter: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="velvetRain"></div>

  <div id="fallingFlower" aria-hidden="true">
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-petal"></span>
    <span class="falling-center"></span>
  </div>

  <div id="startScreen">
    <button id="startBtn" type="button">START</button>
  </div>

  <button id="skipBtn" type="button">SKIP INTRO</button>

  <!-- Correct GitHub Pages path: sounds/intro2.mp3 -->
  <audio id="introAudio" src="sounds/intro2.mp3" preload="auto"></audio>

  <div id="flower" aria-hidden="true">
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="main-petal"></span>
    <span class="flower-core"></span>
  </div>

  <div id="mainTitle">BLACK VELVET CLAN</div>

  <div class="label" id="l1">By the founders of <span class="accent">Azul Clan</span></div>
  <div class="label" id="l2">Forged stronger in the abyss</div>
  <div class="label" id="l3">Motivated by memories</div>
  <div class="label" id="l4">A legacy carved in darkness</div>
  <div class="label" id="l5">Directed by those who never stopped dreaming</div>
  <div class="label" id="l6">Managed by Gears</div>
  <div class="label" id="l7">Back like we never left</div>
  <div class="label" id="l8">FOUNDED BY LUCKYY AND SUOAZ</div>

  <script>
    (() => {
      const startBtn = document.getElementById("startBtn");
      const startScreen = document.getElementById("startScreen");
      const skipBtn = document.getElementById("skipBtn");
      const audio = document.getElementById("introAudio");
      const flower = document.getElementById("flower");
      const mainTitle = document.getElementById("mainTitle");
      const rain = document.getElementById("velvetRain");
      const fallingFlower = document.getElementById("fallingFlower");

      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      const labels = ["l1", "l2", "l3", "l4", "l5", "l6", "l7", "l8"];
      let timers = [];
      let introStarted = false;

      fallingFlower.style.setProperty(
        "--flower-left",
        `${12 + Math.random() * 70}%`
      );

      for (let i = 0; i < (innerWidth < 600 ? 18 : 34); i++) {
        const item = document.createElement("div");
        item.className = "rain-flower";
        item.style.left = `${Math.random() * 100}%`;
        item.style.setProperty("--size", `${10 + Math.random() * 28}px`);
        item.style.setProperty("--opacity", `${.18 + Math.random() * .42}`);
        item.style.setProperty("--duration", `${18 + Math.random() * 22}s`);
        item.style.setProperty("--delay", `${Math.random() * -35}s`);
        item.style.setProperty("--sway", `${-80 + Math.random() * 160}px`);

        for (let j = 0; j < 6; j++) {
          const petal = document.createElement("span");
          petal.className = "petal";
          item.appendChild(petal);
        }

        rain.appendChild(item);
      }

      function schedule(callback, delay) {
        timers.push(setTimeout(callback, delay));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      function startAudio() {
        audio.currentTime = 0;
        audio.volume = 1;
        audio.muted = false;

        audio.play().catch(error => {
          console.error("Audio could not play:", error);
          alert("Audio could not load. Check that sounds/intro2.mp3 exists in GitHub Pages.");
        });
      }

      function showLabel(id) {
        const label = document.getElementById(id);
        label.className = "label";

        if (reducedMotion) {
          label.style.opacity = "1";
          return;
        }

        void label.offsetWidth;
        label.classList.add("playing");
      }

      function startIntro() {
        if (introStarted) return;

        introStarted = true;
        startScreen.classList.add("hidden");
        skipBtn.style.display = "block";
        startAudio();

        labels.forEach((id, index) => {
          schedule(() => showLabel(id), 2000 + index * 5000);
        });

        schedule(() => {
          if (reducedMotion) {
            flower.style.opacity = "1";
            flower.style.transform = "translate(-50%,-50%)";
          } else {
            flower.classList.add("flower-bloom");
          }
        }, 42200);

        schedule(() => {
          if (reducedMotion) {
            mainTitle.style.opacity = "1";
          } else {
            mainTitle.classList.add("title-reveal");
          }
        }, 42830);

        schedule(() => {
          window.location.href = "home.html";
        }, 47830);
      }

      function skipIntro() {
        clearTimers();
        audio.pause();
        audio.currentTime = 0;
        startScreen.classList.remove("hidden");
        skipBtn.style.display = "none";
        introStarted = false;
      }

      audio.addEventListener("error", () => {
        console.error("Audio 404 or loading error:", audio.currentSrc);
      });

      startBtn.addEventListener("click", startIntro);
      skipBtn.addEventListener("click", skipIntro);
    })();
  </script>
</body>
</html>
