<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Classic Mario Style</title>
<style>
    body {
        margin: 0;
        background: #87CEEB;
        overflow: hidden;
    }
    canvas {
        display: block;
        background: #87CEEB;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Player
let player = {
    x: 100,
    y: 0,
    w: 40,
    h: 50,
    velX: 0,
    velY: 0,
    speed: 4,
    jumping: false
};

// Gravity
const gravity = 0.5;
const friction = 0.8;

// Controls
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// World blocks (Mario-style bricks)
let blocks = [];
for (let i = 0; i < 20; i++) {
    blocks.push({
        x: i * 100,
        y: canvas.height - 80,
        w: 100,
        h: 80
    });
}

// Floating bricks
blocks.push({ x: 400, y: canvas.height - 200, w: 80, h: 40 });
blocks.push({ x: 500, y: canvas.height - 300, w: 80, h: 40 });
blocks.push({ x: 600, y: canvas.height - 200, w: 80, h: 40 });

// Camera
let cameraX = 0;

function update() {
    // Movement
    if (keys["ArrowRight"]) player.velX = player.speed;
    else if (keys["ArrowLeft"]) player.velX = -player.speed;
    else player.velX *= friction;

    // Jump
    if (keys[" "] || keys["ArrowUp"]) {
        if (!player.jumping) {
            player.velY = -12;
            player.jumping = true;
        }
    }

    // Apply gravity
    player.velY += gravity;

    // Update position
    player.x += player.velX;
    player.y += player.velY;

    // Collision with blocks
    blocks.forEach(b => {
        if (player.x < b.x + b.w &&
            player.x + player.w > b.x &&
            player.y < b.y + b.h &&
            player.y + player.h > b.y) {

            // Land on top
            if (player.velY > 0) {
                player.y = b.y - player.h;
                player.velY = 0;
                player.jumping = false;
            }
        }
    });

    // Camera follows player
    cameraX = player.x - canvas.width / 2;

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Draw blocks
    ctx.fillStyle = "#B5651D";
    blocks.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "#8B4513";
        ctx.fillRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
        ctx.fillStyle = "#B5651D";
    });

    // Draw player (Mario‑style silhouette)
    ctx.fillStyle = "#FF0000";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.restore();
}

update();
</script>

</body>
</html>
