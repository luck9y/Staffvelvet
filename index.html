<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BL STAFF HQ</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #0d0d0d;
  }
  canvas {
    display: block;
    background: #111;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Player
let player = {
  x: 100,
  y: 100,
  w: 40,
  h: 40,
  speed: 4
};

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Doors
const doors = [
  {x: 600, y: 200, w: 60, h: 60, label: "Continue..?", target: "Continued.html"},
  {x: 1200, y: 400, w: 60, h: 60, label: "Continue..?", target: "Continue.html"},
  {x: 1800, y: 300, w: 80, h: 80, label: "STAFF ONLY", target: "stafflogin.html"}
];

// Map tiles
const tiles = [];
for (let i = 0; i < 2000; i += 80) {
  for (let j = 0; j < 800; j += 80) {
    tiles.push({x: i, y: j});
  }
}

// Camera
let cameraX = 0;
let cameraY = 0;

function update() {
  // Movement SDAW
  if (keys["d"]) player.x += player.speed;
  if (keys["a"]) player.x -= player.speed;
  if (keys["s"]) player.y += player.speed;
  if (keys["w"]) player.y -= player.speed;

  // Camera follows player
  cameraX = player.x - canvas.width / 2 + player.w / 2;
  cameraY = player.y - canvas.height / 2 + player.h / 2;

  // Door interaction
  doors.forEach(d => {
    if (
      player.x < d.x + d.w &&
      player.x + player.w > d.x &&
      player.y < d.y + d.h &&
      player.y + player.h > d.y
    ) {
      if (keys["e"]) window.location.href = d.target;
    }
  });

  draw();
  requestAnimationFrame(update);
}

function drawTile(x, y) {
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(x, y, 80, 80);
  ctx.strokeStyle = "#222";
  ctx.strokeRect(x, y, 80, 80);
  ctx.fillStyle = "#ffffff08";
  ctx.fillRect(x + 10, y + 10, 60, 60);
}

function drawDoor(d) {
  ctx.fillStyle = "#222";
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.strokeStyle = "#fff";
  ctx.strokeRect(d.x, d.y, d.w, d.h);
  ctx.fillStyle = "white";
  ctx.font = "18px Arial";
  ctx.fillText(d.label, d.x - 10, d.y - 10);
  ctx.font = "14px Arial";
  ctx.fillText("Press E", d.x + 5, d.y + d.h + 20);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  // Tiles
  tiles.forEach(t => drawTile(t.x, t.y));

  // Doors
  doors.forEach(d => drawDoor(d));

  // Player
  ctx.fillStyle = "#444";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.restore();
}

update();
</script>
</body>
</html>
