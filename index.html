<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Velvet Clan Intro</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        color: white;
    }

    /* START SCREEN */
    #start-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
    }

    #start-btn {
        padding: 20px 50px;
        background: #111;
        border: 2px solid #333;
        border-radius: 10px;
        color: #ccc;
        font-size: 24px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.2s;
    }

    #start-btn:hover {
        background: #222;
        color: white;
        border-color: #555;
        transform: scale(1.05);
    }

    /* SKIP BUTTON */
    #skip-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #1a1a1a;
        color: #ccc;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #333;
        transition: 0.2s;
        display: none;
        z-index: 998;
    }

    #skip-btn:hover {
        background: #2a2a2a;
        color: white;
    }

    /* INTRO TEXT */
    .intro-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        text-align: center;
        font-size: 36px;
        letter-spacing: 3px;
        transition: opacity 2s ease;
    }

    /* Azul Clan Glow */
    .azul {
        color: #4da6ff;
        text-shadow: 0 0 15px #4da6ff;
    }

    /* Abyss Ember Glow */
    .abyss {
        color: #ff3b3b;
        text-shadow: 0 0 20px #660000;
    }

    /* BLACK VELVET CLAN Movie Animation */
    #bvc {
        font-size: 60px;
        font-weight: bold;
        letter-spacing: 6px;
        opacity: 0;
    }

    #bv-small {
        font-size: 18px;
        margin-top: 10px;
        color: #cfcfcf;
        text-shadow: 0 0 10px #444;
    }

    @keyframes movieZoomRotate {
        0% {
            transform: translate(-50%, -50%) scale(0.3) rotate(-8deg);
            opacity: 0;
        }
        20% {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 1;
        }
        60% {
            transform: translate(-50%, -50%) scale(1.15) rotate(3deg);
            opacity: 1;
        }
        100% {
            transform: translate(150%, -50%) scale(1.15) rotate(3deg);
            opacity: 0;
        }
    }

    /* MAIN SITE */
    #main-site {
        display: none;
        padding: 40px;
        font-size: 24px;
    }
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="intro-audio" src="sounds/intro.mp3"></audio>

<!-- START SCREEN -->
<div id="start-screen">
    <div id="start-btn">START</div>
</div>

<!-- SKIP BUTTON -->
<div id="skip-btn">Skip Intro</div>

<!-- INTRO TEXT SEQUENCE -->
<div id="text1" class="intro-text">
    By the founders of <span class="azul">AZUL CLAN</span>
</div>

<div id="text2" class="intro-text abyss">
    Reborn in the flames of the abyss
</div>

<div id="bvc" class="intro-text">
    BLACK VELVET CLAN
    <div id="bv-small">Founders by Luckyy and Suoaz</div>
</div>

<!-- MAIN SITE -->
<div id="main-site">
    <h1>Welcome to the Black Velvet Clan</h1>
    <p>Main site content goes here.</p>
</div>

<script>
/* AUDIO PLAY */
function playAudio() {
    const audio = document.getElementById("intro-audio");
    audio.volume = 0.5;

    audio.play().catch(() => {
        document.body.addEventListener("touchstart", () => {
            audio.play();
        }, { once: true });
    });
}

/* START INTRO */
document.getElementById("start-btn").onclick = () => {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("skip-btn").style.display = "block";
    playAudio();
    startSequence();
};

/* INTRO SEQUENCE (44 seconds total) */
function startSequence() {

    /* Azul Clan */
    setTimeout(() => text1.style.opacity = 1, 1000);
    setTimeout(() => text1.style.opacity = 0, 6000);

    /* Abyss */
    setTimeout(() => text2.style.opacity = 1, 8000);
    setTimeout(() => text2.style.opacity = 0, 13000);

    /* BLACK VELVET CLAN — Movie Zoom + Rotation */
    setTimeout(() => {
        bvc.style.opacity = 1;
        bvc.style.animation = "movieZoomRotate 6s ease forwards";
    }, 25000);

    /* End intro at 44 seconds */
    setTimeout(() => endIntro(), 44000);
}

/* END INTRO */
function endIntro() {
    text1.style.display = "none";
    text2.style.display = "none";
    bvc.style.display = "none";
    document.getElementById("skip-btn").style.display = "none";
    document.getElementById("main-site").style.display = "block";
}

/* SKIP BUTTON */
document.getElementById("skip-btn").onclick = endIntro;
</script>

</body>
</html>
