<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BL STAFF</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #1a1a1a;
        font-family: Arial, sans-serif;
    }

    #titleScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(#000, #111);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        color: white;
    }

    #titleScreen h1 {
        font-size: 50px;
        letter-spacing: 4px;
        margin-bottom: 20px;
        text-shadow: 0 0 15px #444;
    }

    #playBtn {
        padding: 15px 40px;
        font-size: 22px;
        background: #111;
        border: 2px solid #555;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    #playBtn:hover {
        background: #222;
        border-color: white;
        transform: scale(1.05);
    }

    canvas {
        display: none;
        background: #2a2a2a;
    }
</style>
</head>
<body>

<div id="titleScreen">
    <h1>BL STAFF</h1>
    <button id="playBtn">PLAY</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD SETTINGS
const flowers = [];
for (let i = 0; i < 200; i++) {
    flowers.push({
        x: i * 80,
        y: canvas.height - 40,
        size: 10,
        glow: "#555"
    });
}

// PLAYER
let player = {
    x: 100,
    y: canvas.height - 200,
    w: 40,
    h: 60,
    velX: 0,
    velY: 0,
    speed: 4,
    jumping: false
};

const gravity = 0.5;
const friction = 0.8;

// CONTROLS
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// CAMERA
let cameraX = 0;

// STAFF BASE + DOOR
const baseX = 5000;
const baseY = canvas.height - 200;

const door = {
    x: baseX + 150,
    y: baseY - 120,
    w: 80,
    h: 120,
    open: false
};

// PLAY BUTTON
document.getElementById("playBtn").onclick = () => {
    document.getElementById("titleScreen").style.display = "none";
    canvas.style.display = "block";
};

// GAME LOOP
function update() {
    // Movement SDAW
    if (keys["d"]) player.velX = player.speed;
    else if (keys["a"]) player.velX = -player.speed;
    else player.velX *= friction;

    // Jump
    if (keys["w"] && !player.jumping) {
        player.velY = -12;
        player.jumping = true;
    }

    // Gravity
    player.velY += gravity;

    // Update position
    player.x += player.velX;
    player.y += player.velY;

    // Floor collision
    if (player.y + player.h > canvas.height - 40) {
        player.y = canvas.height - 40 - player.h;
        player.velY = 0;
        player.jumping = false;
    }

    // CAMERA ALWAYS FOLLOWS
    cameraX = player.x - canvas.width / 2;

    // CAMERA LIMITS
    if (cameraX < 0) cameraX = 0;
    if (cameraX > baseX + 300 - canvas.width) cameraX = baseX + 300 - canvas.width;

    // DOOR INTERACTION
    if (
        player.x + player.w > door.x &&
        player.x < door.x + door.w &&
        player.y + player.h > door.y &&
        player.y < door.y + door.h
    ) {
        if (keys["e"]) {
            window.location.href = "stafflogin.html";
        }
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Ground
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, canvas.height - 40, 6000, 40);

    // Velvet flowers
    flowers.forEach(f => {
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = f.glow;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size / 2, 0, Math.PI * 2);
        ctx.fill();
    });

    // Player (shadow figure)
    ctx.fillStyle = "#333";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // STAFF BASE
    ctx.fillStyle = "#222";
    ctx.fillRect(baseX, baseY, 400, 200);

    // STAFF ONLY TEXT
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("STAFF ONLY", baseX + 120, baseY - 20);

    // DOOR
    ctx.fillStyle = "#444";
    ctx.fillRect(door.x, door.y, door.w, door.h);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Press E", door.x + 5, door.y - 10);

    ctx.restore();
}

update();
</script>

</body>
</html>
