<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Black Velvet HQ</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<style>
  body { margin: 0; background: #000; }
</style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: "#0d0d0d",
    physics: {
        default: "arcade",
        arcade: { debug: false }
    },
    scene: { preload, create, update }
};

let player;
let cursors;
let interactKey;
let doors = [];

new Phaser.Game(config);

function preload() {
    // Simple placeholder tiles (you can replace with your own)
    this.textures.generate("tile", { data: ["2222","2332","2222"], pixelWidth: 20 });
    this.textures.generate("player", { data: ["444","474","444"], pixelWidth: 20 });
    this.textures.generate("door", { data: ["999","9F9","999"], pixelWidth: 20 });
}

function create() {
    const mapWidth = 2000;
    const mapHeight = 1200;

    // Tile background
    for (let x = 0; x < mapWidth; x += 40) {
        for (let y = 0; y < mapHeight; y += 40) {
            this.add.image(x, y, "tile").setOrigin(0);
        }
    }

    // Player
    player = this.physics.add.sprite(200, 200, "player");
    player.setCollideWorldBounds(true);

    // Controls
    cursors = this.input.keyboard.addKeys({
        up: "w",
        down: "s",
        left: "a",
        right: "d"
    });
    interactKey = this.input.keyboard.addKey("e");

    // Doors (matching the map layout)
    doors.push(makeDoor(this, 950, 150, "Continued.html", "Continue..?"));
    doors.push(makeDoor(this, 1500, 500, "Continue.html", "Continue..?"));
    doors.push(makeDoor(this, 1800, 300, "stafflogin.html", "STAFF ONLY"));

    // Camera
    this.cameras.main.startFollow(player);
    this.cameras.main.setZoom(1.2);
}

function makeDoor(scene, x, y, target, label) {
    let d = scene.physics.add.sprite(x, y, "door");
    d.target = target;
    d.label = label;

    scene.add.text(x - 40, y - 40, label, {
        fontSize: "20px",
        color: "#ffffff"
    });

    return d;
}

function update() {
    player.setVelocity(0);

    if (cursors.left.isDown) player.setVelocityX(-200);
    if (cursors.right.isDown) player.setVelocityX(200);
    if (cursors.up.isDown) player.setVelocityY(-200);
    if (cursors.down.isDown) player.setVelocityY(200);

    // Door interaction
    doors.forEach(d => {
        if (Phaser.Math.Distance.Between(player.x, player.y, d.x, d.y) < 60) {
            if (interactKey.isDown) {
                window.location.href = d.target;
            }
        }
    });
}
</script>

</body>
</html>
