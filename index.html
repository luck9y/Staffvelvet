<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Black Velvet Clan Intro — Continuous Pass</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&family=Press+Start+2P&family=Major+Mono+Display&display=swap" rel="stylesheet">

<style>
  :root{
    --azul:#4da6ff;
    --abyss:#ff3b3b;
    --bg:#000;
    --audio-target:0.9;
  }

  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:#fff;font-family:Orbitron, sans-serif;-webkit-font-smoothing:antialiased;}

  /* small petals background */
  .petal{position:fixed;top:-80px;width:24px;height:22px;background:radial-gradient(circle at 30% 30%, #0b0b0b 30%, #000 100%);border-radius:50% 50% 40% 60%;box-shadow:0 0 12px rgba(0,0,0,0.6), inset 0 -6px 10px rgba(20,20,20,0.6);opacity:0.85;transform-origin:center;z-index:10;pointer-events:none;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:0.95;}100%{transform:translateY(120vh) rotate(720deg);opacity:0.15;}}

  /* big single flower */
  .big-flower{position:fixed;top:-140px;left:50%;width:140px;height:140px;background:radial-gradient(circle at 30% 30%, #0b0b0b 30%, #000 100%);border-radius:50% 50% 40% 60%;box-shadow:0 0 40px rgba(0,0,0,0.8), inset 0 -12px 20px rgba(30,30,30,0.7);z-index:120;pointer-events:none;opacity:0;transform:translateX(-50%) rotate(-10deg) scale(0.95);}
  @keyframes bigFallTopToBottom { 
    0% { top:-140px; left:50%; opacity:0; transform:translateX(-50%) rotate(-10deg) scale(0.95); }
    10% { opacity:1; }
    60% { top:55vh; left:50%; transform:translateX(-50%) rotate(6deg) scale(1.05); }
    100% { top:120vh; left:50%; opacity:0; transform:translateX(-50%) rotate(20deg) scale(1.2); }
  }

  /* start screen */
  #start-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;background:linear-gradient(180deg, rgba(0,0,0,0.96), rgba(0,0,0,0.92));}
  #start-btn{padding:18px 48px;border-radius:10px;background:#0f0f0f;border:2px solid #222;color:#ddd;font-size:28px;letter-spacing:3px;cursor:pointer;box-shadow:0 8px 40px rgba(0,0,0,0.6);transition:transform .18s,box-shadow .18s;}
  #start-btn:hover{transform:scale(1.04);color:#fff;box-shadow:0 12px 60px rgba(0,0,0,0.7);}

  /* skip */
  #skip-btn{position:fixed;top:18px;right:18px;z-index:1001;display:none;background:#111;color:#cfcfcf;padding:8px 14px;border-radius:8px;border:1px solid #2a2a2a;cursor:pointer;font-size:14px;}
  #skip-btn:hover{background:#222;color:#fff;}

  .vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);z-index:900;}

  /* intro text base + outline so aura doesn't mix */
  .intro-text{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.6);opacity:0;text-align:center;letter-spacing:2px;z-index:50;pointer-events:auto;will-change:transform,opacity,text-shadow;-webkit-text-stroke:1.5px rgba(0,0,0,0.9);text-stroke:1.5px rgba(0,0,0,0.9);}

  /* unique fonts */
  #text1{font-family:'Orbitron',sans-serif;font-size:48px;color:#e6e6e6;}
  #textNew{font-family:'Audiowide',cursive;font-size:44px;color:#f2f2f2;}
  #text2{font-family:'Press Start 2P',monospace;font-size:36px;color:#e8e8e8;letter-spacing:1px;}
  #bvc{font-family:'Major Mono Display',monospace;font-size:84px;letter-spacing:8px;color:#fff;z-index:60;opacity:0;transform:translate(-50%,-50%) scale(0.6);-webkit-text-stroke:2px rgba(0,0,0,0.95);}

  .intro-text .small{display:block;margin-top:12px;font-size:18px;color:#cfcfcf;text-shadow:0 0 12px rgba(0,0,0,0.6);}

  .azul{color:var(--azul);text-shadow:0 0 28px rgba(77,166,255,0.95),0 0 6px rgba(77,166,255,0.25);}
  .abyss{color:var(--abyss);text-shadow:0 0 32px rgba(255,59,59,0.95),0 0 8px rgba(102,0,0,0.25);}

  /* continuous forward pass animations (no pause) */
  @keyframes passLeft {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(-4deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(-160%,-50%) scale(3.2) rotate(-10deg); opacity:0; filter:blur(10px); }
  }
  @keyframes passUp {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(3deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(-50%,-260%) scale(3.0) rotate(18deg); opacity:0; filter:blur(10px); }
  }
  @keyframes passRight {
    0%   { transform:translate(-50%,-50%) scale(0.6) rotate(-2deg); opacity:0; filter:blur(2px); }
    10%  { transform:translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; filter:blur(0); }
    100% { transform:translate(260%,-50%) scale(3.2) rotate(12deg); opacity:0; filter:blur(10px); }
  }

  /* final title at audio+25s: slower, long pass */
  @keyframes finalPass {
    0%   { transform:translate(-50%,-50%) scale(0.45) rotate(-6deg); opacity:0; filter:blur(3px); }
    20%  { transform:translate(-50%,-50%) scale(1.2) rotate(0deg); opacity:1; filter:blur(0); }
    80%  { transform:translate(-45%,-50%) scale(2.8) rotate(10deg); opacity:1; filter:blur(0); }
    100% { transform:translate(320%,-50%) scale(4.2) rotate(22deg); opacity:0; filter:blur(14px); }
  }

  /* afterimage / water aura via ::after */
  .intro-text::after{
    content:attr(data-text);
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0.6);
    z-index:-1;
    opacity:0.55;
    filter:blur(12px) saturate(1.2);
    -webkit-text-stroke:0.8px rgba(0,0,0,0.9);
    pointer-events:none;
    transition:opacity .2s ease;
    white-space:pre;
  }
  #text1::after{color:rgba(77,166,255,0.55);text-shadow:0 0 36px rgba(77,166,255,0.95);}
  #textNew::after{color:rgba(120,200,255,0.45);text-shadow:0 0 32px rgba(120,200,255,0.85);}
  #text2::after{color:rgba(255,80,80,0.45);text-shadow:0 0 34px rgba(255,80,80,0.9);}
  #bvc::after{color:rgba(200,200,255,0.45);text-shadow:0 0 60px rgba(200,200,255,0.95);}

  /* aura animations mirror main pass but blurred and slightly delayed */
  @keyframes auraLeft { 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(-180%,-50%) scale(3.6); opacity:0.12; } }
  @keyframes auraUp   { 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(-50%,-300%) scale(3.4); opacity:0.12; } }
  @keyframes auraRight{ 0%{transform:translate(-50%,-50%) scale(0.6);} 10%{transform:translate(-50%,-50%) scale(1.02);} 100%{transform:translate(300%,-50%) scale(3.6); opacity:0.12; } }
  @keyframes auraFinal{ 0%{transform:translate(-50%,-50%) scale(0.45);} 20%{transform:translate(-50%,-50%) scale(1.25);} 100%{transform:translate(320%,-50%) scale(4.6); opacity:0.08; } }

  /* classes to trigger aura animations on ::after */
  .play-aura-left::after{ animation: auraLeft 7s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-up::after{ animation: auraUp 7s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-right::after{ animation: auraRight 7s cubic-bezier(.2,.8,.2,1) forwards; }
  .play-aura-final::after{ animation: auraFinal 10s cubic-bezier(.2,.8,.2,1) forwards; }

  /* main site placeholder */
  #main-site{display:none;padding:40px;z-index:1;position:relative;color:#ddd;background:linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.02));}
</style>
</head>
<body>

<!-- audio -->
<audio id="intro-audio" src="sounds/intro.mp3" preload="auto"></audio>

<!-- start screen -->
<div id="start-screen"><div id="start-btn" role="button" tabindex="0">START</div></div>

<!-- skip -->
<div id="skip-btn">Skip Intro</div>

<!-- vignette -->
<div class="vignette"></div>

<!-- texts -->
<div id="text1" class="intro-text" data-text="By the founders of AZUL CLAN">By the founders of <span class="azul">AZUL CLAN</span></div>
<div id="textNew" class="intro-text" data-text="Back stronger.">Back stronger.</div>
<div id="text2" class="intro-text" data-text="Reborn in the flames of the abyss">Reborn in the flames of the abyss</div>
<div id="bvc" class="intro-text" data-text="BLACK VELVET CLAN">BLACK VELVET CLAN<span class="small">Founders by Luckyy and Suoaz</span></div>

<!-- main -->
<div id="main-site"><h1>Welcome to Black Velvet Clan</h1><p>Main site content goes here.</p></div>

<script>
/* elements */
const audio = document.getElementById('intro-audio');
const startBtn = document.getElementById('start-btn');
const skipBtn = document.getElementById('skip-btn');
const text1 = document.getElementById('text1');
const textNew = document.getElementById('textNew');
const text2 = document.getElementById('text2');
const bvc = document.getElementById('bvc');
const mainSite = document.getElementById('main-site');

/* spawn background petals */
function spawnPetals(count=28){
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.left=(Math.random()*100)+'vw';
    const s=12+Math.random()*28;
    p.style.width=s+'px'; p.style.height=(s*0.9)+'px';
    const dur=4+Math.random()*7;
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*2)+'s';
    p.style.opacity=0.5+Math.random()*0.45;
    document.body.appendChild(p);
    p.style.animationName='fall';
    p.style.animationTimingFunction='linear';
    p.style.animationIterationCount='infinite';
  }
}

/* big flower falling top->bottom (centered across screen) */
function spawnBigFlowerTopToBottom(duration=2200){
  const f=document.createElement('div');
  f.className='big-flower';
  document.body.appendChild(f);
  // center horizontally and animate top->bottom
  f.style.left='50%';
  f.style.animation = `bigFallTopToBottom ${duration}ms cubic-bezier(.2,.8,.2,1) forwards`;
  // remove after animation
  setTimeout(()=>{ f.style.transition='opacity .6s linear'; f.style.opacity='0'; setTimeout(()=>f.remove(),700); }, duration+300);
}

/* audio ramp */
function rampAudioTo(target, durationMs=3000){
  try{
    audio.volume = 0;
    const stepMs = 50;
    const steps = Math.max(1, Math.floor(durationMs/stepMs));
    let step=0;
    const iv = setInterval(()=>{
      step++;
      const t = step/steps;
      audio.volume = Math.min(target, target * t);
      if(step>=steps){ clearInterval(iv); audio.volume = target; }
    }, stepMs);
  }catch(e){}
}

/* robust audio start delayed by 4s with fade-in */
function playAudioDelayed(delayMs=4000){
  setTimeout(()=>{
    audio.volume = 0;
    audio.play().then(()=>{ rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target'))||0.9, 3500); })
    .catch(()=>{
      const resume = ()=>{ audio.play().then(()=>{ rampAudioTo(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--audio-target'))||0.9,3500); }).catch(()=>{}); window.removeEventListener('pointerdown',resume); window.removeEventListener('touchstart',resume); };
      window.addEventListener('pointerdown', resume, { once:true });
      window.addEventListener('touchstart', resume, { once:true });
    });
  }, delayMs);
}

/* mouse proximity glow */
const introEls = [text1, textNew, text2, bvc];
function updateGlow(e){
  introEls.forEach(el=>{
    if(!el || el.style.display==='none') return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const max = Math.max(window.innerWidth, window.innerHeight);
    const t = Math.max(0, 1 - (dist / (max*0.6)));
    const glow = 12 + Math.round(48 * t);
    const spread = 6 + Math.round(36 * t);
    let color = 'rgba(255,255,255,' + (0.6 + 0.4*t) + ')';
    if(el.id==='text1') color = 'rgba(77,166,255,' + (0.6 + 0.4*t) + ')';
    if(el.id==='text2') color = 'rgba(255,59,59,' + (0.6 + 0.4*t) + ')';
    if(el.id==='textNew') color = 'rgba(120,200,255,' + (0.55 + 0.45*t) + ')';
    if(el.id==='bvc') color = 'rgba(220,220,255,' + (0.6 + 0.4*t) + ')';
    el.style.textShadow = `0 0 ${glow}px ${color}, 0 0 ${spread}px rgba(0,0,0,0.45)`;
    const scale = 0.98 + 0.12 * t;
    el.style.transform = `translate(-50%,-50%) scale(${scale})`;
  });
}
window.addEventListener('pointermove', updateGlow);

/* sequence synced to audio start:
   - click Start (t=0)
   - audio starts at t=4000ms
   - text1 starts at audio+1s => 5000ms, duration 7s => ends 12000ms
   - text2 starts at 12000ms, duration 7s => ends 19000ms
   - text3 starts at 19000ms, duration 7s => ends 26000ms (audio+22s)
   - big flower top->bottom starts immediately after third ends (26000ms) and lasts ~2200ms
   - final title (BLACK VELVET CLAN) appears at audio+25s => 4000 + 25000 = 29000ms after click
   - end intro at audio+44s => 48000ms after click
*/
function startSequence(){
  spawnPetals(30);
  playAudioDelayed(4000);

  // text1: passLeft, 7s
  setTimeout(()=>{
    text1.style.display='block';
    text1.classList.add('play-aura-left');
    text1.style.animation = 'passLeft 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 5000);

  // textNew: passUp, starts when text1 ends (12s)
  setTimeout(()=>{
    textNew.style.display='block';
    textNew.classList.add('play-aura-up');
    textNew.style.animation = 'passUp 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 12000);

  // text2: passRight, starts when textNew ends (19s)
  setTimeout(()=>{
    text2.style.display='block';
    text2.classList.add('play-aura-right');
    text2.style.animation = 'passRight 7s cubic-bezier(.2,.8,.2,1) forwards';
  }, 19000);

  // after text2 ends (26s), spawn big flower falling top->bottom
  setTimeout(()=>{
    // hide small petals gently
    document.querySelectorAll('.petal').forEach(p=>{ p.style.transition='opacity .8s linear'; p.style.opacity='0'; });
    spawnBigFlowerTopToBottom(2200); // ~2.2s fall
  }, 26000);

  // final title at audio+25s => 29000ms after click
  setTimeout(()=>{
    bvc.style.display='block';
    bvc.classList.add('play-aura-final');
    bvc.style.animation = 'finalPass 10s cubic-bezier(.2,.8,.2,1) forwards';
    // nudge audio up a touch for the final
    rampAudioTo(0.98, 3500);
  }, 29000);

  // end intro at audio+44s => 48000ms after click
  setTimeout(()=> endIntro(), 48000);
}

function endIntro(){
  document.querySelectorAll('.petal').forEach(p=>p.remove());
  [text1,textNew,text2,bvc].forEach(el=>{ if(el) el.style.display='none'; });
  skipBtn.style.display='none';
  mainSite.style.display='block';
  try{ audio.pause(); audio.currentTime=0; }catch(e){}
}

/* handlers */
startBtn.addEventListener('click', ()=>{
  document.getElementById('start-screen').style.display='none';
  skipBtn.style.display='block';
  startSequence();
});
skipBtn.addEventListener('click', endIntro);
startBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); startBtn.click(); } });

/* ensure aura classes exist for pseudo-element animations (already defined in CSS) */

/* cleanup */
window.addEventListener('beforeunload', ()=>{ try{ audio.pause(); }catch(e){} });
</script>
</body>
</html>
