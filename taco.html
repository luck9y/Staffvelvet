<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Test</title>
<style>
    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    #play-btn {
        padding: 15px 30px;
        background: #111;
        border: 2px solid #444;
        border-radius: 8px;
        color: #ccc;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 20px;
    }

    #play-btn:hover {
        background: #222;
        color: #fff;
        border-color: #666;
        transform: scale(1.05);
    }
</style>
</head>
<body>

<h1>Audio Test — intro.mp3</h1>
<p>If the audio works, you should hear it after clicking PLAY.</p>

<button id="play-btn">PLAY AUDIO</button>

<audio id="intro-audio" src="sounds/intro.mp3"></audio>

<script>
const audio = document.getElementById("intro-audio");
const btn = document.getElementById("play-btn");

btn.onclick = () => {
    audio.volume = 0.7;
    audio.play().catch(err => {
        console.log("Audio play blocked or error:", err);
    });
};
</script>

</body>
</html>
